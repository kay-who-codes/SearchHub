<style>
.page-header { margin-bottom: 28px; }
.page-header .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    display: block;
    margin-bottom: 6px;
}
.page-header h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 2rem;
    letter-spacing: -0.01em;
}
.page-header p {
    color: var(--text-dim);
    font-size: 0.92rem;
    margin-top: 4px;
}

.xs-section-label {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 22px 0 10px;
}
.xs-section-label:first-of-type { margin-top: 0; }

.xs-card {
    background-color: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 4px;
}

.xs-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}
@media (max-width: 640px) {
    .xs-grid-2 { grid-template-columns: 1fr; }
}

.xs-field-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.xs-field-group label {
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.01em;
}

.xs-field-group input[type="text"],
.xs-field-group input[type="number"],
.xs-field-group input[type="date"],
.xs-field-group select {
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.88rem;
    outline: none;
    width: 100%;
    box-sizing: border-box;
    transition: border-color 0.15s, background-color 0.15s;
}
.xs-field-group input:focus,
.xs-field-group select:focus {
    background-color: var(--surface-2);
    border-color: var(--accent);
}
.xs-field-group input::placeholder { color: var(--text-faint); }
.xs-field-group select { cursor: pointer; }

.xs-sep { height: 1px; background-color: var(--border); margin: 14px 0; }

.xs-flex-row { display: flex; gap: 14px; flex-wrap: wrap; }

/* Chip input */
.xs-chip-area {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background-color: var(--bg);
    min-height: 42px;
    cursor: text;
    transition: border-color 0.15s;
}
.xs-chip-area:focus-within { border-color: var(--accent); }
.xs-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background-color: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.78rem;
    padding: 3px 6px 3px 9px;
    border-radius: 999px;
}
.xs-chip-remove {
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 0.9rem;
    line-height: 1;
    padding: 0 2px;
}
.xs-chip-remove:hover { color: var(--accent); }
.xs-chip-area input {
    flex: 1;
    min-width: 90px;
    border: none;
    background: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.85rem;
    padding: 4px 2px;
}
.xs-chip-area input::placeholder { color: var(--text-faint); }

/* Account fields with preset dropdown */
.xs-account-wrapper { position: relative; }
.xs-account-input-row { display: flex; gap: 8px; }
.xs-account-input-row input { flex: 1; }
.xs-preset-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background-color: var(--bg);
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 0.8rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background-color 0.15s;
}
.xs-preset-btn svg { width: 13px; height: 13px; }
.xs-preset-btn:hover, .xs-preset-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background-color: var(--surface-2);
}
.xs-account-dropdown {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 20;
    background-color: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    max-height: 260px;
    overflow-y: auto;
    box-shadow: 0 12px 28px rgba(0,0,0,0.35);
}
.xs-account-dropdown.open { display: block; }
.xs-dropdown-header {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    padding: 10px 12px 6px;
}
.xs-dropdown-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    cursor: pointer;
    transition: background-color 0.12s;
}
.xs-dropdown-item:hover { background-color: var(--surface); }
.xs-dropdown-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background-color: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    color: var(--accent);
    flex-shrink: 0;
}
.xs-dropdown-info { min-width: 0; flex: 1; }
.xs-dropdown-name {
    font-size: 0.82rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.xs-dropdown-handle {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-faint);
}
.xs-dropdown-badge {
    font-size: 0.62rem;
    color: var(--text-dim);
    background-color: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 8px;
    white-space: nowrap;
    flex-shrink: 0;
}

/* Pill groups */
.xs-pill-group { display: flex; flex-wrap: wrap; gap: 8px; }
.xs-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 13px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background-color: var(--bg);
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s ease;
}
.xs-pill svg { width: 13px; height: 13px; flex-shrink: 0; }
.xs-pill:hover {
    border-color: var(--accent);
    color: var(--text);
    transform: translateY(-1px);
}
.xs-pill.active {
    background-color: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 500;
}

/* Engagement */
.xs-engagement-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
}
@media (max-width: 640px) {
    .xs-engagement-grid { grid-template-columns: 1fr; }
}
.xs-engagement-item { display: flex; flex-direction: column; gap: 6px; }
.xs-engagement-item label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-dim);
}
.xs-engagement-item label svg { width: 13px; height: 13px; color: var(--accent); }
.xs-eng-input-wrap {
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    background-color: var(--bg);
    overflow: hidden;
}
.xs-eng-prefix {
    padding: 0 10px;
    color: var(--text-faint);
    font-family: var(--font-mono);
    font-size: 0.85rem;
}
.xs-eng-input-wrap input {
    border: none;
    background: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.88rem;
    padding: 10px 12px 10px 0;
    width: 100%;
}
.xs-eng-input-wrap:focus-within { border-color: var(--accent); }

/* Query preview */
.xs-query-preview {
    margin-top: 24px;
    background-color: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
}
.xs-query-preview-label {
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 8px;
}
.xs-query-preview-text {
    font-family: var(--font-mono);
    font-size: 0.85rem;
    line-height: 1.6;
    color: var(--text-faint);
    word-break: break-word;
}
.xs-token-keyword { color: var(--accent); }
.xs-token-value { color: var(--text); }
.xs-token-op { color: var(--text-dim); }

/* Actions */
.xs-actions {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
}
.xs-btn-search {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 13px 22px;
    border-radius: 8px;
    border: none;
    background-color: var(--accent);
    color: var(--bg);
    font-family: var(--font-body);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s, box-shadow 0.2s;
}
.xs-btn-search svg { width: 15px; height: 15px; }
.xs-btn-search:hover { background-color: #ddb672; }
.xs-btn-reset {
    padding: 13px 20px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background-color: var(--bg);
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
}
.xs-btn-reset:hover { border-color: var(--accent); color: var(--text); }
</style>

<div class="page-header">

        { handle: 'sama',           name: 'Sam Altman',        badge: 'OpenAI'         },
        { handle: 'ylecun',         name: 'Yann LeCun',        badge: 'Meta AI'        },
        { handle: 'karpathy',       name: 'Andrej Karpathy',   badge: 'AI Research'    },
        { handle: 'geoffreyhinton', name: 'Geoffrey Hinton',   badge: 'AI Research'    },
        { handle: 'demishassabis',  name: 'Demis Hassabis',    badge: 'Google DeepMind'},
        { handle: 'naval',          name: 'Naval Ravikant',    badge: 'Investor'       },
        { handle: 'paulg',          name: 'Paul Graham',       badge: 'Y Combinator'   },
        { handle: 'balajis',        name: 'Balaji Srinivasan', badge: 'Tech'           },
        { handle: 'benedictevans',  name: 'Benedict Evans',    badge: 'Analyst'        },
        { handle: 'levelsio',       name: 'Pieter Levels',     badge: 'Indie Hacker'   },
        { handle: 'dhh',            name: 'DHH',               badge: '37signals'      },
    ];

    function initChipInput(areaId, inputId) {
        const area  = document.getElementById(areaId);
        const input = document.getElementById(inputId);
        const chips = [];
        area.addEventListener('click', () => input.focus());
        input.addEventListener('keydown', e => {
            if ((e.key === 'Enter' || e.key === ',') && input.value.trim()) {
                e.preventDefault();
                addChip(input.value.trim().replace(/,/g, ''));
                input.value = '';
                updatePreview();
            }
            if (e.key === 'Backspace' && !input.value && chips.length) {
                removeChip(chips[chips.length - 1]);
                updatePreview();
            }
        });
        input.addEventListener('blur', () => {
            if (input.value.trim()) {
                addChip(input.value.trim());
                input.value = '';
                updatePreview();
            }
        });
        function addChip(word) {
            if (!word || chips.includes(word)) return;
            chips.push(word);
            const chip = document.createElement('span');
            chip.className = 'xs-chip';
            chip.dataset.word = word;
            chip.innerHTML = `${word}<button class="xs-chip-remove" type="button" aria-label="Remove ${word}">×</button>`;
            chip.querySelector('.xs-chip-remove').addEventListener('click', () => {
                removeChip(word);
                updatePreview();
            });
            area.insertBefore(chip, input);
        }
        function removeChip(word) {
            const idx = chips.indexOf(word);
            if (idx > -1) chips.splice(idx, 1);
            area.querySelectorAll('.xs-chip').forEach(c => {
                if (c.dataset.word === word) c.remove();
            });
        }
        return () => chips.slice();
    }
    const getAnyChips  = initChipInput('any-chips-area',  'any-chips-input');
    const getNoneChips = initChipInput('none-chips-area', 'none-chips-input');

    document.querySelectorAll('#content-type-group .xs-pill, #exclude-type-group .xs-pill').forEach(pill => {
        pill.addEventListener('click', () => {
            const checked = pill.getAttribute('aria-checked') === 'true';
            pill.setAttribute('aria-checked', String(!checked));
            pill.classList.toggle('active', !checked);
            updatePreview();
        });
    });

    document.querySelectorAll('#quick-range-group .xs-pill').forEach(pill => {
        pill.addEventListener('click', () => {
            const wasActive = pill.classList.contains('active');
            document.querySelectorAll('#quick-range-group .xs-pill').forEach(p => {
                p.classList.remove('active');
                p.setAttribute('aria-checked', 'false');
            });
            if (!wasActive) {
                pill.classList.add('active');
                pill.setAttribute('aria-checked', 'true');
                const range = pill.dataset.range;
                const now   = new Date();
                const from  = new Date();
                if (range === '1d')  from.setDate(now.getDate() - 1);
                if (range === '7d')  from.setDate(now.getDate() - 7);
                if (range === '30d') from.setDate(now.getDate() - 30);
                if (range === '90d') from.setDate(now.getDate() - 90);
                if (range === '1y')  from.setFullYear(now.getFullYear() - 1);
                document.getElementById('date-from').value = from.toISOString().split('T')[0];
                document.getElementById('date-to').value   = now.toISOString().split('T')[0];
            } else {
                document.getElementById('date-from').value = '';
                document.getElementById('date-to').value   = '';
            }
            updatePreview();
        });
    });

    ['date-from','date-to'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
            document.querySelectorAll('#quick-range-group .xs-pill').forEach(p => {
                p.classList.remove('active');
                p.setAttribute('aria-checked','false');
            });
            updatePreview();
        });
    });

    function buildDropdown(dropdownEl) {
        dropdownEl.innerHTML = `<div class="xs-dropdown-header">Preset accounts</div>`;
        PRESET_ACCOUNTS.forEach(acc => {
            const item = document.createElement('div');
            item.className = 'xs-dropdown-item';
            item.setAttribute('role', 'option');
            item.setAttribute('tabindex', '0');
            item.innerHTML = `
                <div class="xs-dropdown-avatar">${acc.handle.slice(0,2).toUpperCase()}</div>
                <div class="xs-dropdown-info">
                    <div class="xs-dropdown-name">${acc.name}</div>
                    <div class="xs-dropdown-handle">@${acc.handle}</div>
                </div>
                <span class="xs-dropdown-badge">${acc.badge}</span>`;
            dropdownEl.appendChild(item);
        });
    }
    function initAccountField(inputId, btnId, dropdownId) {
        const input    = document.getElementById(inputId);
        const btn      = document.getElementById(btnId);
        const dropdown = document.getElementById(dropdownId);
        buildDropdown(dropdown);
        function openDropdown() {
            dropdown.classList.add('open');
            btn.classList.add('active');
            btn.setAttribute('aria-expanded', 'true');
        }
        function closeDropdown() {
            dropdown.classList.remove('open');
            btn.classList.remove('active');
            btn.setAttribute('aria-expanded', 'false');
        }
        btn.addEventListener('click', e => {
            e.stopPropagation();
            dropdown.classList.contains('open') ? closeDropdown() : openDropdown();
        });
        dropdown.querySelectorAll('.xs-dropdown-item').forEach((item, i) => {
            const acc = PRESET_ACCOUNTS[i];
            item.addEventListener('click', () => {
                input.value = '@' + acc.handle;
                closeDropdown();
                updatePreview();
            });
            item.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    input.value = '@' + acc.handle;
                    closeDropdown();
                    updatePreview();
                }
            });
        });
        document.addEventListener('click', e => {
            if (!dropdown.contains(e.target) && e.target !== btn && e.target !== input) {
                closeDropdown();
            }
        });
        input.addEventListener('input', updatePreview);
    }
    initAccountField('acc-from',    'from-preset-btn',    'from-dropdown');
    initAccountField('acc-to',      'to-preset-btn',      'to-dropdown');
    initAccountField('acc-mention', 'mention-preset-btn', 'mention-dropdown');

    ['kw-all','kw-exact','kw-hashtag','kw-lang','min-likes','min-retweets','min-replies'].forEach(id => {
        document.getElementById(id).addEventListener('input', updatePreview);
    });

    function buildQuery() {
        const parts = [];
        const all = val('kw-all');
        if (all) all.split(/\s+/).filter(Boolean).forEach(w => parts.push(w));
        const exact = val('kw-exact');
        if (exact) parts.push(`"${exact}"`);
        const anyW = getAnyChips();
        if (anyW.length) parts.push('(' + anyW.join(' OR ') + ')');
        const noneW = getNoneChips();
        noneW.forEach(w => parts.push(`-${w}`));
        const hashtag = val('kw-hashtag');
        if (hashtag) {
            const ht = hashtag.startsWith('#') ? hashtag : '#' + hashtag;
            parts.push(ht);
        }
        const lang = val('kw-lang');
        if (lang) parts.push(lang);
        const from = val('acc-from').replace('@','');
        if (from) parts.push(`from:${from}`);
        const to = val('acc-to').replace('@','');
        if (to) parts.push(`to:${to}`);
        const mention = val('acc-mention').replace('@','');
        if (mention) parts.push(`@${mention}`);
        document.querySelectorAll('#content-type-group .xs-pill.active').forEach(p => parts.push(p.dataset.val));
        document.querySelectorAll('#exclude-type-group .xs-pill.active').forEach(p => parts.push(p.dataset.val));
        const minLikes = val('min-likes');
        if (minLikes && parseInt(minLikes) > 0) parts.push(`min_faves:${minLikes}`);
        const minRT = val('min-retweets');
        if (minRT && parseInt(minRT) > 0) parts.push(`min_retweets:${minRT}`);
        const minRep = val('min-replies');
        if (minRep && parseInt(minRep) > 0) parts.push(`min_replies:${minRep}`);
        const dateFrom = val('date-from');
        if (dateFrom) parts.push(`since:${dateFrom}`);
        const dateTo = val('date-to');
        if (dateTo) parts.push(`until:${dateTo}`);
        return parts.join(' ');
    }
    function val(id) {
        return (document.getElementById(id).value || '').trim();
    }
    const KEYWORD_COLORS = {
        'from:': 'xs-token-keyword', 'to:': 'xs-token-keyword', 'since:': 'xs-token-keyword',
        'until:': 'xs-token-keyword', 'min_faves:': 'xs-token-keyword', 'min_retweets:': 'xs-token-keyword',
        'min_replies:': 'xs-token-keyword', 'lang:': 'xs-token-keyword', 'filter:': 'xs-token-keyword',
        '-filter:': 'xs-token-keyword', '@': 'xs-token-keyword', 'OR': 'xs-token-op',
    };
    function coloriseQuery(q) {
        if (!q) return 'Start filling in the fields above to see your query…';
        return q.split(' ').map(tok => {
            for (const [kw, cls] of Object.entries(KEYWORD_COLORS)) {
                if (tok.startsWith(kw) || tok === kw) {
                    const prefix = tok.startsWith('-') && kw !== '-filter:' ? '-' : '';
                    const rest = tok.slice(prefix.length);
                    const colonIdx = rest.indexOf(':');
                    if (colonIdx > -1) {
                        return `<span class="xs-token-keyword">${prefix}${rest.slice(0, colonIdx+1)}</span><span class="xs-token-value">${rest.slice(colonIdx+1)}</span>`;
                    }
                    return `<span class="${cls}">${tok}</span>`;
                }
            }
            if (tok.startsWith('"') || tok.startsWith('(')) return `<span class="xs-token-value">${tok}</span>`;
            if (tok.startsWith('-')) return `<span class="xs-token-op">-</span><span class="xs-token-value">${tok.slice(1)}</span>`;
            return `<span class="xs-token-value">${tok}</span>`;
        }).join(' ');
    }
    function updatePreview() {
        const q = buildQuery();
        document.getElementById('preview-text').innerHTML = coloriseQuery(q);
    }

    document.getElementById('btn-search').addEventListener('click', () => {
        const q = buildQuery().trim();
        if (!q) {
            pulse(document.getElementById('btn-search'));
            return;
        }
        const url = 'https://twitter.com/search?q=' + encodeURIComponent(q) + '&src=typed_query&f=live';
        window.open(url, '_blank', 'noopener,noreferrer');
    });
    function pulse(el) {
        el.style.boxShadow = '0 0 0 6px rgba(197,155,86,0.35)';
        setTimeout(() => { el.style.boxShadow = ''; }, 400);
    }

    document.getElementById('btn-reset').addEventListener('click', () => {
        ['kw-all','kw-exact','kw-hashtag','acc-from','acc-to','acc-mention','min-likes','min-retweets','min-replies','date-from','date-to'].forEach(id => {
            document.getElementById(id).value = '';
        });
        document.getElementById('kw-lang').value = '';
        ['any-chips-area','none-chips-area'].forEach(areaId => {
            document.querySelectorAll(`#${areaId} .xs-chip`).forEach(c => c.remove());
        });
        document.querySelectorAll('.xs-pill.active').forEach(p => {
            p.classList.remove('active');
            p.setAttribute('aria-checked','false');
        });
        updatePreview();
    });

    updatePreview();

    window.__pageFocus = window.__pageFocus || {};
    window.__pageFocus.search = function () {
        setTimeout(() => document.getElementById('kw-all').focus(), 50);
    };
})();
</script>
