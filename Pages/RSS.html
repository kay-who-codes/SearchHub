<style>
/* ── RSS / Dispatch page — all classes prefixed with rss- to avoid
   colliding with the host app's global stylesheet (which defines its
   own .rail, .nav-item, .dot, .count, .rail-footer, etc. for the
   sidebar). Every class below is scoped this way. ── */

.page08-eyebrow {
    font-family: var(--font-mono, monospace);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent, #c9a35f);
    display: block;
    margin-bottom: 6px;
}

.rss-app {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
    min-height: 60vh;
    max-width: 100%;
}

.rss-app *,
.rss-app *::before,
.rss-app *::after {
    box-sizing: border-box;
}

/* ── Left rail ── */
.rss-rail {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px 0 0 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
}

.rss-rail h1 {
    font-family: var(--font-display);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
}

.rss-rail h1 span {
    color: var(--accent);
}

.rss-search-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

#page08-search-input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.88rem;
}

#page08-search-input:focus {
    outline: none;
    border-color: var(--accent);
}

#page08-search-input::placeholder {
    color: var(--text-faint);
}

.rss-search-all-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    width: 100%;
}

.rss-search-all-btn:hover:not(:disabled) {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
}

.rss-search-all-btn:disabled {
    opacity: 0.45;
    cursor: default;
}

.rss-search-hint {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    color: var(--text-faint);
    line-height: 1.5;
    min-height: 1em;
}

/* ── Feed tree / nav ── */
.rss-tree {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1;
}

.rss-nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: transparent;
    border: none;
    border-radius: 8px;
    padding: 9px 10px;
    cursor: pointer;
    text-align: left;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 0.86rem;
    transition: background 0.15s, color 0.15s;
}

.rss-nav-item:hover {
    background: var(--accent-soft);
    color: var(--text);
}

.rss-nav-item.rss-active {
    background: var(--accent-soft);
    color: var(--text);
    font-weight: 500;
}

.rss-nav-item .rss-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-faint);
    flex-shrink: 0;
}

.rss-nav-item.rss-active .rss-dot {
    background: var(--accent);
    box-shadow: 0 0 6px 1px var(--accent);
}

.rss-nav-item span:nth-child(2) {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.rss-nav-item .rss-count {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text-faint);
    flex-shrink: 0;
}

.rss-category-group {
    display: flex;
    flex-direction: column;
    margin-top: 6px;
}

.rss-category-header {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: transparent;
    border: none;
    padding: 6px 10px;
    cursor: pointer;
    text-align: left;
    color: var(--text-faint);
    font-family: var(--font-mono);
    font-size: 0.66rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
}

.rss-category-header:hover {
    color: var(--text-dim);
}

.rss-category-header .rss-chevron {
    display: inline-block;
    transition: transform 0.15s;
    font-size: 0.7rem;
}

.rss-category-header.rss-open .rss-chevron {
    transform: rotate(90deg);
}

.rss-category-header .rss-count {
    margin-left: auto;
    font-family: var(--font-mono);
}

.rss-category-feeds {
    display: none;
    flex-direction: column;
    gap: 2px;
    padding-left: 6px;
}

.rss-category-feeds.rss-open {
    display: flex;
}

.rss-rail-footer {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 0.64rem;
    color: var(--text-faint);
    line-height: 1.6;
}

.rss-rail-footer button {
    margin-top: 6px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 9px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 0.64rem;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
}

.rss-rail-footer button:hover {
    background: var(--accent-soft);
    color: var(--accent);
}

/* ── Main content ── */
.rss-app main {
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 0 12px 12px 0;
    padding: 24px 28px 28px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
    overflow-x: hidden;
}

.rss-main-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
    flex-wrap: wrap;
}

.rss-main-head h2 {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--text);
    word-break: break-word;
}

.rss-updated {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-faint);
    letter-spacing: 0.03em;
    white-space: nowrap;
}

/* ── Status / skeleton states ── */
.rss-status {
    font-family: var(--font-body);
    color: var(--text-dim);
    padding: 24px 0;
}

.rss-status.rss-error {
    color: #e0776e;
}

.rss-skeleton {
    height: 76px;
    border-radius: 10px;
    margin-bottom: 10px;
    background: linear-gradient(
        100deg,
        var(--surface) 30%,
        var(--surface-2) 50%,
        var(--surface) 70%
    );
    background-size: 200% 100%;
    animation: rss-skeleton-shimmer 1.4s ease-in-out infinite;
}

@keyframes rss-skeleton-shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* ── Item list ── */
.rss-items {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.rss-item {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 14px;
    padding: 12px;
    border-radius: 10px;
    transition: background 0.15s;
}

.rss-item:hover {
    background: var(--surface);
}

.rss-thumb-wrap {
    position: relative;
    width: 96px;
    height: 72px;
    flex-shrink: 0;
}

.rss-thumb {
    width: 96px;
    height: 72px;
    object-fit: cover;
    border-radius: 8px;
    display: block;
    background: var(--surface-2);
}

.rss-thumb.rss-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
}

.rss-thumb-wrap .rss-date {
    position: absolute;
    bottom: 4px;
    left: 4px;
    background: rgba(0, 0, 0, 0.65);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.6rem;
    padding: 2px 5px;
    border-radius: 4px;
    letter-spacing: 0.02em;
}

.rss-item h3 {
    font-family: var(--font-body);
    font-size: 0.96rem;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 4px;
    overflow-wrap: break-word;
}

.rss-item h3 a {
    color: var(--text);
    text-decoration: none;
}

.rss-item h3 a:hover {
    color: var(--accent);
    text-decoration: underline;
}

.rss-snippet {
    font-family: var(--font-body);
    font-size: 0.82rem;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
}

.rss-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text-faint);
    flex-wrap: wrap;
    row-gap: 4px;
}

.rss-meta .rss-sep {
    color: var(--text-faint);
    opacity: 0.5;
}

.rss-source-badge {
    color: var(--accent);
    font-weight: 500;
}

.rss-meta .rss-category {
    color: var(--text-dim);
}

.rss-load-more-sentinel {
    text-align: center;
    padding: 14px 0;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text-faint);
}

/* ── Responsive: tablets / small laptops ── */
@media (max-width: 900px) {
    .rss-app {
        grid-template-columns: 220px 1fr;
    }

    .rss-app main {
        padding: 20px 18px 22px;
    }
}

/* ── Responsive: phones — stack rail above content ── */
@media (max-width: 760px) {
    .rss-app {
        grid-template-columns: 1fr;
        min-height: 0;
    }

    .rss-rail {
        border-radius: 12px 12px 0 0;
        border-bottom: none;
        max-height: 44vh;
        padding: 16px;
    }

    .rss-app main {
        border-radius: 0 0 12px 12px;
        border-left: 1px solid var(--border);
        border-top: none;
        padding: 18px 16px 20px;
        gap: 14px;
    }

    .rss-main-head {
        padding-bottom: 10px;
    }

    .rss-main-head h2 {
        font-size: 1.15rem;
    }

    .rss-item {
        grid-template-columns: 72px 1fr;
        gap: 10px;
        padding: 10px 6px;
    }

    .rss-thumb-wrap,
    .rss-thumb {
        width: 72px;
        height: 54px;
    }

    .rss-item h3 {
        font-size: 0.9rem;
    }

    .rss-snippet {
        font-size: 0.78rem;
        -webkit-line-clamp: 2;
    }

    .rss-search-box {
        flex-direction: row;
        flex-wrap: wrap;
    }

    #page08-search-input {
        flex: 1 1 100%;
    }

    .rss-search-all-btn {
        flex: 1 1 100%;
        padding: 9px 10px;
    }
}

/* ── Responsive: very small phones — drop thumbnail, single column item ── */
@media (max-width: 420px) {
    .rss-rail {
        max-height: 38vh;
        padding: 14px;
    }

    .rss-rail h1 {
        font-size: 1.1rem;
    }

    .rss-app main {
        padding: 14px 12px 16px;
    }

    .rss-item {
        grid-template-columns: 1fr;
        gap: 8px;
    }

    .rss-thumb-wrap {
        width: 100%;
        height: 150px;
    }

    .rss-thumb {
        width: 100%;
        height: 150px;
    }

    .rss-meta {
        font-size: 0.64rem;
    }
}
</style>

<div class="rss-app">
  <aside class="rss-rail">
    <span class="page08-eyebrow">08</span>
    <h1>RSS Feeder<span>.</span></h1>
 
    <div class="rss-search-box">
      <input id="page08-search-input" type="text" placeholder="Search titles, categories, tags…" autocomplete="off">
      <button id="page08-search-all-btn" type="button" class="rss-search-all-btn" title="Search every feed, including ones not yet loaded">Search all feeds</button>
      <div class="rss-search-hint" id="page08-search-hint"></div>
    </div>
 
    <nav class="rss-tree" id="page08-feed-nav"></nav>
 
    <div class="rss-rail-footer">
      Sources fetched live via a public RSS proxy.<br>
      <button id="page08-refresh-btn" type="button">Refresh current view</button>
    </div>
  </aside>
 
  <main>
    <div class="rss-main-head">
      <h2 id="page08-feed-title">Loading…</h2>
      <span class="rss-updated" id="page08-feed-updated"></span>
    </div>
    <div id="page08-content">
      <div class="rss-skeleton"></div>
      <div class="rss-skeleton"></div>
      <div class="rss-skeleton"></div>
    </div>
  </main>
</div>
 
<script>
(function () {
  // ============================================================
  // Feed configuration
  // Add, remove, or recategorize feeds here. `category` groups
  // feeds in the left rail tree; `tags` are invisible metadata
  // reserved for future filtering and are also searchable.
  // ============================================================

  const FEEDS = [
    {
      name: "Word of the Day",
      url: "https://www.thefreedictionary.com/_/WoD/rss.aspx",
      type: "article",
      category: "Language",
      tags: ["dictionary", "vocabulary", "english"]
    },
    {
      name: "Bank of England",
      url: "https://www.bankofengland.co.uk/rss/news",
      type: "article",
      category: "Finance",
      tags: ["central-bank", "uk", "monetary-policy"]
    },
    {
      name: "CodePen",
      url: "https://codepen.io/spark/feed",
      type: "article",
      category: "Programming",
      tags: ["education"]
    },
    {
      name: "REPO",
      url: "https://store.steampowered.com/feeds/news/app/3241660",
      type: "article",
      category: "Gaming",
      tags: ["co-op", "horror"]
    },
    {
      name: "Skate.",
      url: "https://store.steampowered.com/feeds/news/app/3354750",
      type: "article",
      category: "Gaming",
      tags: ["sports", "multiplayer"]
    },
    {
      name: "Phasmophobia",
      url: "https://store.steampowered.com/feeds/news/app/739630",
      type: "article",
      category: "Gaming",
      tags: ["horror", "co-op"]
    },
    {
      name: "Tabletop Simulator",
      url: "https://store.steampowered.com/feeds/news/app/286160",
      type: "article",
      category: "Gaming",
      tags: ["simulation", "tabletop"]
    },
    {
      name: "Borderlands 4",
      url: "https://store.steampowered.com/feeds/news/app/1285190",
      type: "article",
      category: "Gaming",
      tags: ["looter-shooter", "fps"]
    },
    {
      name: "Wreckfest",
      url: "https://store.steampowered.com/feeds/news/app/228380",
      type: "article",
      category: "Gaming",
      tags: ["racing", "destruction"]
    },
    // Paradox Games (all games) cannot be represented by a single Steam feed URL.
    // You would need to add each Paradox game individually using their specific App IDs.
    {
      name: "Mewgenics",
      url: "https://store.steampowered.com/feeds/news/app/686060",
      type: "article",
      category: "Gaming",
      tags: ["roguelike", "tactics"]
    }
  ];

  // Online version: intentionally keyless. Leave as "" (do not delete the
  // constant; buildProxyUrl and loadFeed both reference it).
  const RSS2JSON_API_KEY = "";
  const WORDS_PER_MIN = 200;
  const PROXY = "https://api.rss2json.com/v1/api.json?rss_url=";
  const FETCH_LIMIT = 4;
  const THROTTLE_MS = 300;
  const STALE_MS = 5 * 60 * 1000;
  const SEARCH_DEBOUNCE_MS = 250;
  const RENDER_BATCH_SIZE = 10;
  const MAX_SNIPPET_CHARS = 220;

  // ---- DOM refs (scoped to this page's namespaced ids) ----
  const feedNav = document.getElementById("page08-feed-nav");
  const content = document.getElementById("page08-content");
  const feedTitle = document.getElementById("page08-feed-title");
  const feedUpdated = document.getElementById("page08-feed-updated");
  const refreshBtn = document.getElementById("page08-refresh-btn");
  const searchInput = document.getElementById("page08-search-input");
  const searchAllBtn = document.getElementById("page08-search-all-btn");
  const searchHint = document.getElementById("page08-search-hint");

  // ---- State ----
  const cache = {};              // feed.url -> {items, fetchedAt}
  const openCategories = new Set(FEEDS.map(f => f.category || "Uncategorized")); // start expanded
  let view = { mode: "feed", index: 0 };   // {mode:'feed', index} | {mode:'all'} | {mode:'search', query}
  let searchTimer = null;
  let observer = null;

  // Group feeds by category, preserving FEEDS order within each group.
  function groupByCategory(){
    const groups = new Map();
    FEEDS.forEach((feed, i) => {
      const cat = feed.category || "Uncategorized";
      if (!groups.has(cat)) groups.set(cat, []);
      groups.get(cat).push({ feed, index: i });
    });
    return groups;
  }

  // ============================================================
  // Rendering: left rail (category tree)
  // ============================================================
  function renderNav(){
    feedNav.innerHTML = "";

    // "All" aggregate view
    const allBtn = document.createElement("button");
    allBtn.className = "rss-nav-item" + (view.mode === "all" ? " rss-active" : "");
    allBtn.type = "button";
    const totalLoaded = FEEDS.reduce((sum, f) => sum + (cache[f.url] ? cache[f.url].items.length : 0), 0);
    allBtn.innerHTML = `<span class="rss-dot"></span><span>All feeds</span><span class="rss-count">${totalLoaded || ""}</span>`;
    allBtn.addEventListener("click", () => selectAll());
    feedNav.appendChild(allBtn);

    const groups = groupByCategory();
    groups.forEach((entries, category) => {
      const isOpen = openCategories.has(category);

      const group = document.createElement("div");
      group.className = "rss-category-group";

      const header = document.createElement("button");
      header.type = "button";
      header.className = "rss-category-header" + (isOpen ? " rss-open" : "");
      header.innerHTML = `<span class="rss-chevron">▸</span><span>${escapeHtml(category)}</span><span class="rss-count">${entries.length}</span>`;
      header.addEventListener("click", () => {
        if (openCategories.has(category)) openCategories.delete(category);
        else openCategories.add(category);
        renderNav();
      });
      group.appendChild(header);

      const feedsWrap = document.createElement("div");
      feedsWrap.className = "rss-category-feeds" + (isOpen ? " rss-open" : "");
      entries.forEach(({ feed, index }) => {
        const btn = document.createElement("button");
        btn.className = "rss-nav-item" + (view.mode === "feed" && view.index === index ? " rss-active" : "");
        btn.type = "button";
        const count = cache[feed.url] ? cache[feed.url].items.length : "";
        btn.innerHTML = `<span class="rss-dot"></span><span>${escapeHtml(feed.name)}</span><span class="rss-count">${count}</span>`;
        btn.addEventListener("click", () => selectFeed(index));
        feedsWrap.appendChild(btn);
      });
      group.appendChild(feedsWrap);

      feedNav.appendChild(group);
    });
  }

  // ============================================================
  // Helpers
  // ============================================================
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[s]));
  }

  function stripHtml(html){
    const tmp = document.createElement("div");
    tmp.innerHTML = html || "";
    return tmp.textContent || tmp.innerText || "";
  }

  function extractThumbnail(item){
    // 1. rss2json's thumbnail field, or the one our Steam loader set
    //    from the first <img> in the update body (this is the per-update image).
    if (item.thumbnail && item.thumbnail.trim()) return item.thumbnail.trim();

    // 2. <enclosure url="..."> — rss2json exposes it as item.enclosure.link
    if (item.enclosure && item.enclosure.link && item.enclosure.link.trim()){
      return item.enclosure.link.trim();
    }

    // 3. Media RSS <media:content url="..."> if the proxy passed it through
    if (item.media && item.media.content && item.media.content.url){
      return item.media.content.url;
    }

    // 4. <img> inside description/content HTML (generic feeds)
    const source = item.description || item.content || "";
    const match = source.match(/<img[^>]+src=["']([^"']+)["']/i);
    if (match) return match[1];

    // 5. Steam fallback: store header capsule from the App ID in the feed URL.
    //    Only reached if the update body had no image at all. Every item
    //    from the same game will share this image — acceptable last resort.
    const feed = item._feed || {};
    if (feed.url){
      const appIdMatch = feed.url.match(/\/app\/(\d+)/);
      if (appIdMatch){
        return `https://cdn.akamai.steamstatic.com/steam/apps/${appIdMatch[1]}/header.jpg`;
      }
    }

    return null;
  }

  function wordCount(text){
    const trimmed = text.trim();
    if (!trimmed) return 0;
    return trimmed.split(/\s+/).length;
  }

  function readingTime(words){
    return Math.max(1, Math.round(words / WORDS_PER_MIN));
  }

  function formatDate(iso){
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function timeAgo(iso){
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const diff = Date.now() - d.getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 60) return `${Math.max(mins,0)}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    if (days < 30) return `${days}d ago`;
    return formatDate(iso);
  }

  // ============================================================
  // Data loading
  // ============================================================

  // Builds the full rss2json proxy URL for a feed, appending the item
  // count and (if configured) the API key. Kept in one place so every
  // request is built identically.
  function buildProxyUrl(feedUrl){
    let url = PROXY + encodeURIComponent(feedUrl) + "&count=" + FETCH_LIMIT;
    if (RSS2JSON_API_KEY){
      url += "&api_key=" + encodeURIComponent(RSS2JSON_API_KEY);
    }
    return url;
  }

  const STEAM_NEWS_API = "https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/";
  const STEAM_NEWS_VIEW = "https://store.steampowered.com/news/app/";
  // Steam's API sends no CORS headers, so browser requests go through a
  // third-party CORS proxy. If it misbehaves, swap this one line, e.g. for
  // "https://api.allorigins.win/raw?url=" (same encodeURIComponent pattern).

// Tried in order; the first one that returns a good response wins.
const STEAM_PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];

async function fetchSteamJson(target){
  let lastErr;
  for (const build of STEAM_PROXIES){
    try {
      const res = await fetch(build(target));
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } catch (err){
      lastErr = err;
    }
  }
  throw new Error("All Steam proxies failed (" + (lastErr ? lastErr.message : "unknown") + ")");
}

  function steamAppIdFromUrl(feedUrl){
    const m = String(feedUrl || "").match(/store\.steampowered\.com\/feeds\/news\/app\/(\d+)/);
    return m ? m[1] : null;
  }

  // Pulls the first usable <img> out of Steam's update HTML. Steam
  // sometimes wraps images in <a> or <figure>, so we just scan for the
  // first <img src="..."> and skip obvious tracking pixels / spacers.
  function firstImageFromHtml(html){
    if (!html) return null;
    const re = /<img[^>]+src=["']([^"']+)["']/gi;
    let m;
    while ((m = re.exec(html)) !== null){
      const src = m[1].trim();
      if (!src) continue;
      // Skip 1x1 spacers / tracking pixels common in Steam bodies
      if (/\/transparent\.gif$/i.test(src)) continue;
      if (/\b(1x1|pixel|spacer)\b/i.test(src)) continue;
      return src;
    }
    return null;
  }

  // Strips HTML to a plain-text snippet for the card body, collapsing
  // Steam's [img] BBCode-ish leftovers and excess whitespace.
  function steamHtmlToText(html){
    return stripHtml(html || "")
      .replace(/\[img\][\s\S]*?\[\/img\]/gi, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

async function loadSteamFeed(feed, appId){
  const target = STEAM_NEWS_API +
    "?appid=" + encodeURIComponent(appId) +
    "&count=" + FETCH_LIMIT +
    "&maxlength=0" +
    "&format=json";

  const data = await fetchSteamJson(target);

  const news = (data && data.appnews && data.appnews.newsitems) || [];
  // ...rest unchanged

    const items = news.map(n => {
      const contents = n.contents || "";
      const thumb = firstImageFromHtml(contents);
      const text = steamHtmlToText(contents);
      return {
        // Shape matches what rss2json returns, so the renderer needs no changes.
        title: n.title || "(untitled)",
        link: STEAM_NEWS_VIEW + appId + "/view/" + n.gid,
        pubDate: n.date ? new Date(n.date * 1000).toISOString() : "",
        description: text,
        content: contents,
        thumbnail: thumb || "",
        _feed: feed
      };
    });

    return { items, fetchedAt: new Date() };
  }

  // Dispatcher: Steam feeds go to the Steam API (via the CORS proxy);
  // everything else goes through the rss2json proxy. Caching, staleness,
  // and force-refresh semantics are identical for both paths.
  async function loadFeed(feed, force){
    const cached = cache[feed.url];
    const isStale = cached && (Date.now() - cached.fetchedAt.getTime() > STALE_MS);
    if (cached && !force && !isStale) return cached;

    let entry;

    const appId = steamAppIdFromUrl(feed.url);
    if (appId){
      // ---- Steam path: Steam API through the CORS proxy ----
      entry = await loadSteamFeed(feed, appId);
    } else {
      // ---- Generic path: rss2json proxy ----
      const res = await fetch(buildProxyUrl(feed.url));
      if (!res.ok){
        if (res.status === 429){
          throw new Error("Network error (429 — rate-limited by rss2json). Wait a moment and try again.");
        }
        throw new Error("Network error (" + res.status + ")");
      }
      const data = await res.json();
      if (data.status !== "ok") throw new Error(data.message || "Feed could not be parsed");

      const items = (data.items || []).map(it => ({ ...it, _feed: feed }));
      entry = { items, fetchedAt: new Date() };
    }

    cache[feed.url] = entry;
    return entry;
  }

  async function ensureAllLoaded(force){
    for (const f of FEEDS) {
      const cached = cache[f.url];
      const isStale = cached && (Date.now() - cached.fetchedAt.getTime() > STALE_MS);
      if (cached && !force && !isStale) continue;
      try {
        await loadFeed(f, force);
      } catch (err) {
        console.warn("Feed failed:", f.name, err.message);
      }
      if (!steamAppIdFromUrl(f.url)){
        await new Promise(r => setTimeout(r, THROTTLE_MS));
      }
    }
  }

  // ============================================================
  // Rendering: item list (shared by feed / all / search views)
  // Batched rendering + "load more" sentinel keeps large result
  // sets cheap to paint instead of building thousands of DOM nodes
  // up front.
  // ============================================================
  function renderItemList(items, opts){
    opts = opts || {};
    const showBadge = !!opts.showBadge;

    if (!items.length){
      content.innerHTML = `<p class="rss-status">${escapeHtml(opts.emptyText || "No items to show.")}</p>`;
      return;
    }

    content.innerHTML = "";
    const list = document.createElement("ul");
    list.className = "rss-items";
    content.appendChild(list);

    const sentinel = document.createElement("div");
    sentinel.className = "rss-load-more-sentinel";
    content.appendChild(sentinel);

    let rendered = 0;

    function renderBatch(){
      const next = items.slice(rendered, rendered + RENDER_BATCH_SIZE);
      next.forEach(item => list.appendChild(buildItemNode(item, showBadge)));
      rendered += next.length;
      sentinel.textContent = rendered < items.length
        ? `Loading more… (${rendered} / ${items.length})`
        : "";
      if (rendered >= items.length && observer){
        observer.disconnect();
        observer = null;
      }
    }

    renderBatch();

    if (rendered < items.length){
      if (observer) observer.disconnect();
      observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting) renderBatch();
      });
      observer.observe(sentinel);
    }
  }

  function buildItemNode(item, showBadge){
    const feed = item._feed || {};
    const li = document.createElement("li");
    li.className = "rss-item";

    const snippetText = stripHtml(item.description || item.content || "").trim();
    const thumbUrl = extractThumbnail(item);
    const initial = (item.title || "?").trim().charAt(0).toUpperCase();

    const thumbHtml = thumbUrl
      ? `<img class="rss-thumb" src="${escapeHtml(thumbUrl)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;rss-thumb rss-placeholder&quot;>${escapeHtml(initial)}</div>'">`
      : `<div class="rss-thumb rss-placeholder">${escapeHtml(initial)}</div>`;

    // Reading-time estimate disabled — RSS summaries are too short/unreliable
    // to give a meaningful read-time for the full article. Left in place,
    // commented, in case a full-text fetch is added later.
    // const words = wordCount(snippetText);
    // const mins = words > 0 ? readingTime(words) : null;

    const badgeHtml = showBadge && feed.name
      ? `<span class="rss-source-badge">${escapeHtml(feed.name)}</span><span class="rss-sep">·</span>`
      : "";
    const categoryHtml = feed.category
      ? `<span class="rss-category">${escapeHtml(feed.category)}</span><span class="rss-sep">·</span>`
      : "";
    const tagsAttr = (feed.tags || []).join(",");

    li.innerHTML = `
      <div class="rss-thumb-wrap">
        ${thumbHtml}
        <div class="rss-date">${formatDate(item.pubDate)}</div>
      </div>
      <div>
        <h3><a href="${item.link}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a></h3>
        ${snippetText ? `<p class="rss-snippet">${escapeHtml(snippetText.slice(0, MAX_SNIPPET_CHARS))}${snippetText.length > MAX_SNIPPET_CHARS ? "…" : ""}</p>` : ""}
        <div class="rss-meta">
          ${badgeHtml}
          ${categoryHtml}
          <span>${timeAgo(item.pubDate)}</span>
        </div>
      </div>
    `;
    li.dataset.tags = tagsAttr; // invisible — not rendered, used by search
    return li;
  }

  function renderSkeleton(){
    content.innerHTML = `
      <div class="rss-skeleton"></div>
      <div class="rss-skeleton"></div>
      <div class="rss-skeleton"></div>
    `;
  }

  // ============================================================
  // View controllers
  // ============================================================
  async function selectFeed(i, force){
    searchInput.value = "";
    view = { mode: "feed", index: i };
    const feed = FEEDS[i];
    feedTitle.textContent = feed.name;
    renderNav();

    const cached = cache[feed.url];
    if (!cached) renderSkeleton();
    else renderItemList(cached.items, { showBadge: false });

    try {
      const entry = await loadFeed(feed, force);
      feedUpdated.textContent = "Updated " + entry.fetchedAt.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
      renderItemList(entry.items, { showBadge: false });
      renderNav();
    } catch (err) {
      // A TypeError from fetch means the request never completed (CORS block,
      // offline, blocked by an extension); anything else carries its own message.
      const msg = err instanceof TypeError
        ? "Request blocked or network unreachable (possibly CORS)"
        : err.message;
      console.error("Feed load failed:", feed.name, err);
      content.innerHTML = `<p class="rss-status rss-error">Couldn't load this feed — ${escapeHtml(msg)}.</p>`;
      feedUpdated.textContent = "";
    }
  }

  async function selectAll(force){
    searchInput.value = "";
    view = { mode: "all" };
    feedTitle.textContent = "All feeds";
    renderNav();
    renderSkeleton();

    await ensureAllLoaded(force);
    const merged = FEEDS
      .flatMap(f => (cache[f.url] ? cache[f.url].items : []))
      .sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

    feedUpdated.textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    renderItemList(merged, { showBadge: true, emptyText: "No items loaded yet." });
    renderNav();
  }

  async function runSearch(query){
    view = { mode: "search", query };
    feedTitle.textContent = `Search: "${query}"`;
    feedUpdated.textContent = "";
    filterAndRender(query);
  }

  // Filters whatever is currently cached — no network requests.
  // This is what runs on every keystroke.
  function filterAndRender(query){
    const q = query.trim().toLowerCase();
    const all = FEEDS.flatMap(f => (cache[f.url] ? cache[f.url].items : []));
    const results = all.filter(item => {
      const feed = item._feed || {};
      const haystack = [
        item.title,
        stripHtml(item.description || item.content || ""),
        feed.name,
        feed.category,
        ...(feed.tags || [])
      ].join(" ").toLowerCase();
      return haystack.includes(q);
    }).sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

    renderItemList(results, {
      showBadge: true,
      emptyText: `No items match "${query}".`
    });

    const loadedCount = FEEDS.filter(f => cache[f.url]).length;
    searchHint.textContent = loadedCount < FEEDS.length
      ? `Showing results from ${loadedCount}/${FEEDS.length} loaded feeds. Press Enter or "Search all feeds" for full coverage.`
      : "";
    searchAllBtn.disabled = loadedCount >= FEEDS.length;
  }

  // Loads every not-yet-cached feed, then re-filters. Only runs on
  // explicit user action (Enter key or the "Search all feeds" button) —
  // never automatically while typing, since at scale that would mean
  // firing off requests for every feed on every keystroke.
  async function searchAllFeeds(){
    const query = searchInput.value.trim();
    if (!query) return;
    view = { mode: "search", query };
    feedTitle.textContent = `Search: "${query}"`;
    searchAllBtn.disabled = true;
    searchAllBtn.textContent = "Searching all feeds…";

    await ensureAllLoaded(false);

    searchAllBtn.textContent = "Search all feeds";
    filterAndRender(query);
    renderNav();
  }

  // ============================================================
  // Search input wiring
  // Typing filters cached data only (debounced, no network calls).
  // A full search across every feed only happens on Enter or the
  // "Search all feeds" button — see searchAllFeeds().
  // ============================================================
  function onSearchInput(){
    const q = searchInput.value.trim();
    clearTimeout(searchTimer);
    if (!q){
      searchHint.textContent = "";
      searchAllBtn.disabled = true;
      selectFeed(view.mode === "feed" ? view.index : 0);
      return;
    }
    searchAllBtn.disabled = false;
    searchTimer = setTimeout(() => runSearch(q), SEARCH_DEBOUNCE_MS);
  }

  function onSearchKeydown(e){
    if (e.key === "Enter"){
      clearTimeout(searchTimer);
      searchAllFeeds();
    }
  }

  function onSearchAllClick(){ searchAllFeeds(); }

  function onRefreshClick(){
    if (view.mode === "feed") selectFeed(view.index, true);
    else if (view.mode === "all") selectAll(true);
    else if (view.mode === "search") runSearch(view.query);
  }

  searchInput.addEventListener("input", onSearchInput);
  searchInput.addEventListener("keydown", onSearchKeydown);
  searchAllBtn.addEventListener("click", onSearchAllClick);
  refreshBtn.addEventListener("click", onRefreshClick);

  // ---- Init ----
  searchAllBtn.disabled = true;
  renderNav();
  selectFeed(0);

  // ============================================================
  // Shell integration
  // ============================================================
  // Focus hook: called by the shell whenever this page becomes visible
  // (matches the pattern the shell already uses for other pages).
  window.__pageFocus = window.__pageFocus || {};
  window.__pageFocus.page08 = function () {
    setTimeout(() => searchInput.focus(), 50);
  };

  // Cleanup hook: called by the shell right before this fragment is
  // reloaded, so a stale timer or observer from a previous load doesn't
  // keep running against DOM nodes that are about to be replaced.
  window.__pageCleanup = window.__pageCleanup || {};
  window.__pageCleanup.page08 = function () {
    clearTimeout(searchTimer);
    if (observer) {
      observer.disconnect();
      observer = null;
    }
  };

})();
</script>
