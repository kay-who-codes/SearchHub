<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console — Personal Web Deck</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/kay-who-codes/SVG-Browser@main/SVGs/Universe-Magnifying-Glass.svg">
<link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/kay-who-codes/SVG-Browser@main/SVGs/Universe-Magnifying-Glass.svg">
<link rel="manifest" href="/manifest.json">

<style>
    :root {
        /* ── Token system ── */
        --bg: #14171c;
        --bg-rail: #0f1115;
        --surface: #1b1f27;
        --surface-2: #232838;
        --border: #2b3040;
        --text: #e9e6dd;
        --text-dim: #838a9b;
        --text-faint: #565c6b;
        --accent: #c9a35f;       /* brass — primary signal */
        --accent-soft: rgba(201, 163, 95, 0.14);
        --accent2: #4fb0a8;      /* teal — secondary signal */
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);

        --font-display: 'Fraunces', Georgia, serif;
        --font-body: 'Inter', 'Segoe UI', sans-serif;
        --font-mono: 'IBM Plex Mono', 'Courier New', monospace;

        --rail-w: 232px;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
    }

    html {
        min-height: 100%;
    }

    body {
        background:
            radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201, 163, 95, 0.06), transparent 60%),
            var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        line-height: 1.6;
        min-height: 100vh;
        display: grid;
        grid-template-columns: var(--rail-w) 1fr;
    }

    ::selection {
        background: var(--accent-soft);
        color: var(--text);
    }

    a { color: inherit; }

    :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
    }

    /* ── Rail (sidebar nav) ── */
    .rail {
        background: var(--bg-rail);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 28px 18px;
        position: sticky;
        top: 0;
        height: 100vh;
    }

    .brand {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 0 8px 22px 8px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--border);
    }

    .brand .mark {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.4rem;
        letter-spacing: 0.01em;
    }

    .brand .mark::after {
        content: '.';
        color: var(--accent);
    }

    .brand .tag {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-faint);
    }

    .rail-eyebrow {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-faint);
        padding: 0 8px;
        margin-bottom: 10px;
    }

    /* ── Nav list (the "channel strip" — signature element) ── */
    #nav-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        background: transparent;
        border: none;
        border-radius: 8px;
        padding: 10px 10px;
        cursor: pointer;
        text-align: left;
        color: var(--text-dim);
        transition: background 0.15s, color 0.15s;
    }

    .nav-item:hover {
        background: var(--surface);
        color: var(--text);
    }

    .nav-item.active {
        background: var(--accent-soft);
        color: var(--text);
    }

    .nav-item .idx {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--text-faint);
        width: 1.4em;
        flex-shrink: 0;
    }

    .nav-item.active .idx {
        color: var(--accent);
    }

    .nav-item i.nav-icon {
        width: 16px;
        text-align: center;
        font-size: 0.85rem;
        flex-shrink: 0;
        color: var(--text-faint);
    }

    .nav-item.active i.nav-icon {
        color: var(--accent);
    }

    .nav-item .label {
        font-size: 0.92rem;
        font-weight: 500;
        flex: 1;
    }

    .nav-item .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: transparent;
        flex-shrink: 0;
    }

    .nav-item.active .dot {
        background: var(--accent);
        box-shadow: 0 0 8px 1px var(--accent);
    }

    .rail-footer {
        margin-top: auto;
        padding: 14px 8px 4px 8px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: var(--font-mono);
        font-size: 0.68rem;
        color: var(--text-faint);
        letter-spacing: 0.04em;
    }

    #clock {
        color: var(--text-dim);
    }

    /* ── Main viewport ── */
    .viewport {
        padding: 40px 48px 60px;
        max-width: 960px;
        width: 100%;
        margin: 0 auto;
    }

    .section-panel {
        display: none;
        animation: rise 0.25s ease;
    }
    .section-panel.visible {
        display: block;
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .panel-loading {
        color: var(--text-faint);
        font-family: var(--font-mono);
        font-size: 0.8rem;
        padding: 40px 0;
    }

    /* ── Mobile: rail collapses to a top strip ── */
    @media (max-width: 760px) {
        body {
            grid-template-columns: 1fr;
        }

        .rail {
            position: static;
            height: auto;
            flex-direction: row;
            align-items: center;
            padding: 14px 14px;
            border-right: none;
            border-bottom: 1px solid var(--border);
            gap: 16px;
            overflow-x: auto;
        }

        .brand {
            border-bottom: none;
            padding: 0;
            margin-bottom: 0;
            flex-shrink: 0;
        }

        .rail-eyebrow {
            display: none;
        }

        #nav-list {
            flex-direction: row;
            gap: 6px;
        }

        .nav-item {
            flex-shrink: 0;
        }

        .nav-item .label {
            white-space: nowrap;
        }

        .rail-footer {
            display: none;
        }

        .viewport {
            padding: 28px 20px 48px;
        }
    }
</style>
</head>
<body>

    <!-- ── Rail: sidebar / mobile top-strip navigation ── -->
    <nav class="rail">
        <div class="brand">
            <span class="mark">Console</span>
            <span class="tag">v2</span>
        </div>
        <div class="rail-eyebrow">Channels</div>
        <ul id="nav-list"></ul>
        <div class="rail-footer">
            <span>DECK</span>
            <span id="clock">--:--</span>
        </div>
    </nav>

    <!-- ── Main content ── -->
    <main class="viewport" id="viewport"></main>

    <script>
        /* ────────────────────────────────────────────────────────────
           PAGE REGISTRY
           Add a new page by adding one entry here and dropping a
           matching fragment file (its own <style>/markup/<script>)
           next to index.html. Nothing else needs to change.
        ──────────────────────────────────────────────────────────── */
        const PAGES = [
            { id: 'bookmarks', label: 'Bookmarks', icon: 'fa-solid fa-star',      file: 'bookmarks.html' },
            { id: 'search',    label: 'Search',    icon: 'fa-solid fa-magnifying-glass', file: 'search.html' },
            { id: 'advanced',  label: 'Advanced',  icon: 'fa-solid fa-cogs', file: 'advanced.html' },
            { id: 'subsearch', label: 'SubSearch', icon: 'fa-solid fa-layer-group', file: 'subsearch.html' },
            { id: 'lexsearch', label: 'LexSearch', icon: 'fa-solid fa-scale-balanced', file: 'lexsearch.html' }
        ];

        const navList = document.getElementById('nav-list');
        const viewport = document.getElementById('viewport');

        function buildNav() {
            PAGES.forEach((page, i) => {
                const li = document.createElement('li');
                const btn = document.createElement('button');
                btn.className = 'nav-item' + (i === 0 ? ' active' : '');
                btn.id = 'nav-' + page.id;
                btn.addEventListener('click', () => showSection(page.id));
                btn.innerHTML = `
                    <span class="idx">${String(i + 1).padStart(2, '0')}</span>
                    <i class="nav-icon ${page.icon}"></i>
                    <span class="label">${page.label}</span>
                    <span class="dot"></span>
                `;
                li.appendChild(btn);
                navList.appendChild(li);
            });
        }

        function buildPanels() {
            PAGES.forEach((page, i) => {
                const panel = document.createElement('div');
                panel.className = 'section-panel' + (i === 0 ? ' visible' : '');
                panel.id = 'panel-' + page.id;
                panel.innerHTML = '<p class="panel-loading">Loading…</p>';
                viewport.appendChild(panel);
            });
        }

        function showSection(id) {
            PAGES.forEach(page => {
                document.getElementById('panel-' + page.id).classList.toggle('visible', page.id === id);
                document.getElementById('nav-' + page.id).classList.toggle('active', page.id === id);
            });
            const focusFn = window.__pageFocus && window.__pageFocus[id];
            if (typeof focusFn === 'function') focusFn();
        }
        window.showSection = showSection;

        // ── Generic fragment loader ──
        // Fetches an HTML fragment (its own <style>/markup/<script>) and
        // mounts it into the given container, executing its script.
        async function loadFragment(url, containerId) {
    const container = document.getElementById(containerId);
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`${res.status}`);
        const html = await res.text();

        // Extract <style> blocks directly from raw text (regex, not DOMParser —
        // DOMParser's HTML parsing gets confused by <svg> markup nested inside
        // <script> template literals and ends script parsing early).
        const styleRe = /<style[^>]*>([\s\S]*?)<\/style>/gi;
        let m;
        while ((m = styleRe.exec(html)) !== null) {
            const styleEl = document.createElement('style');
            styleEl.textContent = m[1];
            document.head.appendChild(styleEl);
        }

        // Extract <script> blocks the same way.
        const scriptRe = /<script[^>]*>([\s\S]*?)<\/script>/gi;
        const scripts = [];
        while ((m = scriptRe.exec(html)) !== null) {
            scripts.push(m[1]);
        }

        // Whatever's left after stripping style/script tags is the markup.
        const markup = html.replace(styleRe, '').replace(scriptRe, '');
        container.innerHTML = markup;

        // Re-create and append each script so it actually executes.
        scripts.forEach(code => {
            const s = document.createElement('script');
            s.textContent = code;
            document.body.appendChild(s);
        });
    } catch (err) {
        container.innerHTML = `<p class="panel-loading">Couldn't load this page (${err.message}). If you're opening this file directly from disk, serve it over a local web server instead.</p>`;
    }
}

        function tickClock() {
            const el = document.getElementById('clock');
            const now = new Date();
            el.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        document.addEventListener('DOMContentLoaded', () => {
            buildNav();
            buildPanels();
            PAGES.forEach(page => loadFragment(page.file, 'panel-' + page.id));
            tickClock();
            setInterval(tickClock, 15000);
        });
    </script>
</body>
</html>
