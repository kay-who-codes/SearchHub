<style>
  
.app {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
    min-height: 60vh;
}

/* ── Left rail ── */
.app .rail {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px 0 0 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
}

.app .rail h1 {
    font-family: var(--font-display);
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text);
}

.app .rail h1 span {
    color: var(--accent);
}

.search-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

#rss-search-input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.88rem;
}

#rss-search-input:focus {
    outline: none;
    border-color: var(--accent);
}

#rss-search-input::placeholder {
    color: var(--text-faint);
}

.search-all-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
}

.search-all-btn:hover:not(:disabled) {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
}

.search-all-btn:disabled {
    opacity: 0.45;
    cursor: default;
}

.search-hint {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    color: var(--text-faint);
    line-height: 1.5;
    min-height: 1em;
}

/* ── Feed tree / nav ── */
.tree {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    flex: 1;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: transparent;
    border: none;
    border-radius: 8px;
    padding: 9px 10px;
    cursor: pointer;
    text-align: left;
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 0.86rem;
    transition: background 0.15s, color 0.15s;
}

.nav-item:hover {
    background: var(--accent-soft);
    color: var(--text);
}

.nav-item.active {
    background: var(--accent-soft);
    color: var(--text);
    font-weight: 500;
}

.nav-item .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-faint);
    flex-shrink: 0;
}

.nav-item.active .dot {
    background: var(--accent);
    box-shadow: 0 0 6px 1px var(--accent);
}

.nav-item span:nth-child(2) {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.nav-item .count {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text-faint);
    flex-shrink: 0;
}

.category-group {
    display: flex;
    flex-direction: column;
    margin-top: 6px;
}

.category-header {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: transparent;
    border: none;
    padding: 6px 10px;
    cursor: pointer;
    text-align: left;
    color: var(--text-faint);
    font-family: var(--font-mono);
    font-size: 0.66rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
}

.category-header:hover {
    color: var(--text-dim);
}

.category-header .chevron {
    display: inline-block;
    transition: transform 0.15s;
    font-size: 0.7rem;
}

.category-header.open .chevron {
    transform: rotate(90deg);
}

.category-header .count {
    margin-left: auto;
    font-family: var(--font-mono);
}

.category-feeds {
    display: none;
    flex-direction: column;
    gap: 2px;
    padding-left: 6px;
}

.category-feeds.open {
    display: flex;
}

.rail-footer {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 0.64rem;
    color: var(--text-faint);
    line-height: 1.6;
}

.rail-footer button {
    margin-top: 6px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 9px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 0.64rem;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
}

.rail-footer button:hover {
    background: var(--accent-soft);
    color: var(--accent);
}

/* ── Main content ── */
.app main {
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 0 12px 12px 0;
    padding: 24px 28px 28px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.main-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
    flex-wrap: wrap;
}

.main-head h2 {
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--text);
}

.updated {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-faint);
    letter-spacing: 0.03em;
}

/* ── Status / skeleton states ── */
.status {
    font-family: var(--font-body);
    color: var(--text-dim);
    padding: 24px 0;
}

.status.error {
    color: #e0776e;
}

.skeleton {
    height: 76px;
    border-radius: 10px;
    margin-bottom: 10px;
    background: linear-gradient(
        100deg,
        var(--surface) 30%,
        var(--surface-2) 50%,
        var(--surface) 70%
    );
    background-size: 200% 100%;
    animation: skeleton-shimmer 1.4s ease-in-out infinite;
}

@keyframes skeleton-shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* ── Item list ── */
.items {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.item {
    display: grid;
    grid-template-columns: 96px 1fr;
    gap: 14px;
    padding: 12px;
    border-radius: 10px;
    transition: background 0.15s;
}

.item:hover {
    background: var(--surface);
}

.thumb-wrap {
    position: relative;
    width: 96px;
    height: 72px;
    flex-shrink: 0;
}

.thumb {
    width: 96px;
    height: 72px;
    object-fit: cover;
    border-radius: 8px;
    display: block;
    background: var(--surface-2);
}

.thumb.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
}

.thumb-wrap .date {
    position: absolute;
    bottom: 4px;
    left: 4px;
    background: rgba(0, 0, 0, 0.65);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.6rem;
    padding: 2px 5px;
    border-radius: 4px;
    letter-spacing: 0.02em;
}

.item h3 {
    font-family: var(--font-body);
    font-size: 0.96rem;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 4px;
}

.item h3 a {
    color: var(--text);
    text-decoration: none;
}

.item h3 a:hover {
    color: var(--accent);
    text-decoration: underline;
}

.snippet {
    font-family: var(--font-body);
    font-size: 0.82rem;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text-faint);
    flex-wrap: wrap;
}

.meta .sep {
    color: var(--text-faint);
    opacity: 0.5;
}

.source-badge {
    color: var(--accent);
    font-weight: 500;
}

.meta .category {
    color: var(--text-dim);
}

.load-more-sentinel {
    text-align: center;
    padding: 14px 0;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text-faint);
}

/* ── Responsive ── */
@media (max-width: 760px) {
    .app {
        grid-template-columns: 1fr;
    }

    .app .rail {
        border-radius: 12px 12px 0 0;
        border-bottom: none;
        max-height: 260px;
    }

    .app main {
        border-radius: 0 0 12px 12px;
        border-left: 1px solid var(--border);
        border-top: none;
    }

    .item {
        grid-template-columns: 72px 1fr;
    }

    .thumb-wrap,
    .thumb {
        width: 72px;
        height: 54px;
    }
}
</style>

<div class="app">
  <aside class="rail">
    <h1>Dispatch<span>.</span></h1>

    <div class="search-box">
      <input id="rss-search-input" type="text" placeholder="Search titles, categories, tags…" autocomplete="off">
      <button id="rss-search-all-btn" type="button" class="search-all-btn" title="Search every feed, including ones not yet loaded">Search all feeds</button>
      <div class="search-hint" id="rss-search-hint"></div>
    </div>

    <nav class="tree" id="rss-feed-nav"></nav>

    <div class="rail-footer">
      Sources fetched live via a public RSS proxy.<br>
      <button id="rss-refresh-btn" type="button">Refresh current view</button>
    </div>
  </aside>

  <main>
    <div class="main-head">
      <h2 id="rss-feed-title">Loading…</h2>
      <span class="updated" id="rss-feed-updated"></span>
    </div>
    <div id="rss-content">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  </main>
</div>

<script>
(function () {
  // Feed configuration

  const FEEDS = [
    {
      name: "Bank of England",
      url: "https://www.bankofengland.co.uk/rss/news",
      type: "article",
      category: "Finance",
      tags: ["central-bank", "uk", "monetary-policy"]
    },
    {
      name: "Vsauce",
      url: "https://www.youtube.com/feeds/videos.xml?channel_id=UC6nSFpj9HTCZ5t-N3Rm3-HA",
      type: "video",
      category: "Science",
      tags: ["youtube", "education"]
    }
  ];

  const WORDS_PER_MIN = 200; // average adult silent reading speed (currently unused — see renderItems)
  const PROXY = "https://api.rss2json.com/v1/api.json?rss_url=";
  const STALE_MS = 5 * 60 * 1000;      // cached feed data older than this refetches on select
  const SEARCH_DEBOUNCE_MS = 250;
  const RENDER_BATCH_SIZE = 30;         // items rendered per batch — keeps huge lists cheap to paint
  const MAX_SNIPPET_CHARS = 220;

  // ---- DOM refs (scoped to this page's namespaced ids) ----
  const feedNav = document.getElementById("rss-feed-nav");
  const content = document.getElementById("rss-content");
  const feedTitle = document.getElementById("rss-feed-title");
  const feedUpdated = document.getElementById("rss-feed-updated");
  const refreshBtn = document.getElementById("rss-refresh-btn");
  const searchInput = document.getElementById("rss-search-input");
  const searchAllBtn = document.getElementById("rss-search-all-btn");
  const searchHint = document.getElementById("rss-search-hint");

  // ---- State ----
  const cache = {};              // feed.url -> {items, fetchedAt}
  const openCategories = new Set(FEEDS.map(f => f.category || "Uncategorized")); // start expanded
  let view = { mode: "feed", index: 0 };   // {mode:'feed', index} | {mode:'all'} | {mode:'search', query}
  let searchTimer = null;
  let observer = null;

  // Group feeds by category, preserving FEEDS order within each group.
  function groupByCategory(){
    const groups = new Map();
    FEEDS.forEach((feed, i) => {
      const cat = feed.category || "Uncategorized";
      if (!groups.has(cat)) groups.set(cat, []);
      groups.get(cat).push({ feed, index: i });
    });
    return groups;
  }

  // Rendering: left rail (category tree)
  function renderNav(){
    feedNav.innerHTML = "";

    // "All" aggregate view
    const allBtn = document.createElement("button");
    allBtn.className = "nav-item" + (view.mode === "all" ? " active" : "");
    allBtn.type = "button";
    const totalLoaded = FEEDS.reduce((sum, f) => sum + (cache[f.url] ? cache[f.url].items.length : 0), 0);
    allBtn.innerHTML = `<span class="dot"></span><span>All feeds</span><span class="count">${totalLoaded || ""}</span>`;
    allBtn.addEventListener("click", () => selectAll());
    feedNav.appendChild(allBtn);

    const groups = groupByCategory();
    groups.forEach((entries, category) => {
      const isOpen = openCategories.has(category);

      const group = document.createElement("div");
      group.className = "category-group";

      const header = document.createElement("button");
      header.type = "button";
      header.className = "category-header" + (isOpen ? " open" : "");
      header.innerHTML = `<span class="chevron">▸</span><span>${escapeHtml(category)}</span><span class="count">${entries.length}</span>`;
      header.addEventListener("click", () => {
        if (openCategories.has(category)) openCategories.delete(category);
        else openCategories.add(category);
        renderNav();
      });
      group.appendChild(header);

      const feedsWrap = document.createElement("div");
      feedsWrap.className = "category-feeds" + (isOpen ? " open" : "");
      entries.forEach(({ feed, index }) => {
        const btn = document.createElement("button");
        btn.className = "nav-item" + (view.mode === "feed" && view.index === index ? " active" : "");
        btn.type = "button";
        const count = cache[feed.url] ? cache[feed.url].items.length : "";
        btn.innerHTML = `<span class="dot"></span><span>${escapeHtml(feed.name)}</span><span class="count">${count}</span>`;
        btn.addEventListener("click", () => selectFeed(index));
        feedsWrap.appendChild(btn);
      });
      group.appendChild(feedsWrap);

      feedNav.appendChild(group);
    });
  }

  // Helpers
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[s]));
  }

  function stripHtml(html){
    const tmp = document.createElement("div");
    tmp.innerHTML = html || "";
    return tmp.textContent || tmp.innerText || "";
  }

  function extractThumbnail(item){
    if (item.thumbnail && item.thumbnail.trim()) return item.thumbnail.trim();
    const source = item.description || item.content || "";
    const match = source.match(/<img[^>]+src=["']([^"']+)["']/i);
    return match ? match[1] : null;
  }

  function wordCount(text){
    const trimmed = text.trim();
    if (!trimmed) return 0;
    return trimmed.split(/\s+/).length;
  }

  function readingTime(words){
    return Math.max(1, Math.round(words / WORDS_PER_MIN));
  }

  function formatDate(iso){
    const d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function timeAgo(iso){
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const diff = Date.now() - d.getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 60) return `${Math.max(mins,0)}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    if (days < 30) return `${days}d ago`;
    return formatDate(iso);
  }

  // Data loading

  async function loadFeed(feed, force){
    const cached = cache[feed.url];
    const isStale = cached && (Date.now() - cached.fetchedAt.getTime() > STALE_MS);
    if (cached && !force && !isStale) return cached;

    const res = await fetch(PROXY + encodeURIComponent(feed.url));
    if (!res.ok) throw new Error("Network error (" + res.status + ")");
    const data = await res.json();
    if (data.status !== "ok") throw new Error(data.message || "Feed could not be parsed");

    const items = (data.items || []).map(it => ({ ...it, _feed: feed }));
    const entry = { items, fetchedAt: new Date() };
    cache[feed.url] = entry;
    return entry;
  }

  async function ensureAllLoaded(force){
    await Promise.all(FEEDS.map(f => loadFeed(f, force).catch(() => null)));
  }

  // Rendering: item list (shared by feed / all / search views)

  function renderItemList(items, opts){
    opts = opts || {};
    const showBadge = !!opts.showBadge;

    if (!items.length){
      content.innerHTML = `<p class="status">${escapeHtml(opts.emptyText || "No items to show.")}</p>`;
      return;
    }

    content.innerHTML = "";
    const list = document.createElement("ul");
    list.className = "items";
    content.appendChild(list);

    const sentinel = document.createElement("div");
    sentinel.className = "load-more-sentinel";
    content.appendChild(sentinel);

    let rendered = 0;

    function renderBatch(){
      const next = items.slice(rendered, rendered + RENDER_BATCH_SIZE);
      next.forEach(item => list.appendChild(buildItemNode(item, showBadge)));
      rendered += next.length;
      sentinel.textContent = rendered < items.length
        ? `Loading more… (${rendered} / ${items.length})`
        : "";
      if (rendered >= items.length && observer){
        observer.disconnect();
        observer = null;
      }
    }

    renderBatch();

    if (rendered < items.length){
      if (observer) observer.disconnect();
      observer = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting) renderBatch();
      });
      observer.observe(sentinel);
    }
  }

  function buildItemNode(item, showBadge){
    const feed = item._feed || {};
    const li = document.createElement("li");
    li.className = "item";

    const snippetText = stripHtml(item.description || item.content || "").trim();
    const thumbUrl = extractThumbnail(item);
    const initial = (item.title || "?").trim().charAt(0).toUpperCase();

    const thumbHtml = thumbUrl
      ? `<img class="thumb" src="${escapeHtml(thumbUrl)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;thumb placeholder&quot;>${escapeHtml(initial)}</div>'">`
      : `<div class="thumb placeholder">${escapeHtml(initial)}</div>`;

    const badgeHtml = showBadge && feed.name
      ? `<span class="source-badge">${escapeHtml(feed.name)}</span><span class="sep">·</span>`
      : "";
    const categoryHtml = feed.category
      ? `<span class="category">${escapeHtml(feed.category)}</span><span class="sep">·</span>`
      : "";
    const tagsAttr = (feed.tags || []).join(",");

    li.innerHTML = `
      <div class="thumb-wrap">
        ${thumbHtml}
        <div class="date">${formatDate(item.pubDate)}</div>
      </div>
      <div>
        <h3><a href="${item.link}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a></h3>
        ${snippetText ? `<p class="snippet">${escapeHtml(snippetText.slice(0, MAX_SNIPPET_CHARS))}${snippetText.length > MAX_SNIPPET_CHARS ? "…" : ""}</p>` : ""}
        <div class="meta">
          ${badgeHtml}
          ${categoryHtml}
          <span>${timeAgo(item.pubDate)}</span>
        </div>
      </div>
    `;
    li.dataset.tags = tagsAttr;
    return li;
  }

  function renderSkeleton(){
    content.innerHTML = `
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    `;
  }

  async function selectFeed(i, force){
    searchInput.value = "";
    view = { mode: "feed", index: i };
    const feed = FEEDS[i];
    feedTitle.textContent = feed.name;
    renderNav();

    const cached = cache[feed.url];
    if (!cached) renderSkeleton();
    else renderItemList(cached.items, { showBadge: false });

    try {
      const entry = await loadFeed(feed, force);
      feedUpdated.textContent = "Updated " + entry.fetchedAt.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
      renderItemList(entry.items, { showBadge: false });
      renderNav();
    } catch (err) {
      content.innerHTML = `<p class="status error">Couldn't load this feed — ${escapeHtml(err.message)}. The proxy service may be rate-limited; try refreshing in a moment.</p>`;
      feedUpdated.textContent = "";
    }
  }

  async function selectAll(force){
    searchInput.value = "";
    view = { mode: "all" };
    feedTitle.textContent = "All feeds";
    renderNav();
    renderSkeleton();

    await ensureAllLoaded(force);
    const merged = FEEDS
      .flatMap(f => (cache[f.url] ? cache[f.url].items : []))
      .sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

    feedUpdated.textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    renderItemList(merged, { showBadge: true, emptyText: "No items loaded yet." });
    renderNav();
  }

  async function runSearch(query){
    view = { mode: "search", query };
    feedTitle.textContent = `Search: "${query}"`;
    feedUpdated.textContent = "";
    filterAndRender(query);
  }

  function filterAndRender(query){
    const q = query.trim().toLowerCase();
    const all = FEEDS.flatMap(f => (cache[f.url] ? cache[f.url].items : []));
    const results = all.filter(item => {
      const feed = item._feed || {};
      const haystack = [
        item.title,
        stripHtml(item.description || item.content || ""),
        feed.name,
        feed.category,
        ...(feed.tags || [])
      ].join(" ").toLowerCase();
      return haystack.includes(q);
    }).sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

    renderItemList(results, {
      showBadge: true,
      emptyText: `No items match "${query}".`
    });

    const loadedCount = FEEDS.filter(f => cache[f.url]).length;
    searchHint.textContent = loadedCount < FEEDS.length
      ? `Showing results from ${loadedCount}/${FEEDS.length} loaded feeds. Press Enter or "Search all feeds" for full coverage.`
      : "";
    searchAllBtn.disabled = loadedCount >= FEEDS.length;
  }

  async function searchAllFeeds(){
    const query = searchInput.value.trim();
    if (!query) return;
    view = { mode: "search", query };
    feedTitle.textContent = `Search: "${query}"`;
    searchAllBtn.disabled = true;
    searchAllBtn.textContent = "Searching all feeds…";

    await ensureAllLoaded(false);

    searchAllBtn.textContent = "Search all feeds";
    filterAndRender(query);
    renderNav();
  }

  // Search input wiring

  function onSearchInput(){
    const q = searchInput.value.trim();
    clearTimeout(searchTimer);
    if (!q){
      searchHint.textContent = "";
      searchAllBtn.disabled = true;
      selectFeed(view.mode === "feed" ? view.index : 0);
      return;
    }
    searchAllBtn.disabled = false;
    searchTimer = setTimeout(() => runSearch(q), SEARCH_DEBOUNCE_MS);
  }

  function onSearchKeydown(e){
    if (e.key === "Enter"){
      clearTimeout(searchTimer);
      searchAllFeeds();
    }
  }

  function onSearchAllClick(){ searchAllFeeds(); }

  function onRefreshClick(){
    if (view.mode === "feed") selectFeed(view.index, true);
    else if (view.mode === "all") selectAll(true);
    else if (view.mode === "search") runSearch(view.query);
  }

  searchInput.addEventListener("input", onSearchInput);
  searchInput.addEventListener("keydown", onSearchKeydown);
  searchAllBtn.addEventListener("click", onSearchAllClick);
  refreshBtn.addEventListener("click", onRefreshClick);

  // ---- Init ----
  searchAllBtn.disabled = true;
  renderNav();
  selectFeed(0);

  window.__pageFocus = window.__pageFocus || {};
  window.__pageFocus.rss = function () {
    setTimeout(() => searchInput.focus(), 50);
  };

  window.__pageCleanup = window.__pageCleanup || {};
  window.__pageCleanup.rss = function () {
    clearTimeout(searchTimer);
    if (observer) {
      observer.disconnect();
      observer = null;
    }
  };

})();
</script>
