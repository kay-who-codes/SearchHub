<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>SearchHub</title>

<!-- Theme Colors -->
<meta name="theme-color" content="#14171c">
<meta name="color-scheme" content="dark">

<!-- Web App Settings -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SearchHub">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&amp;family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">

<!-- Favicon (modern browsers) -->
<link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/kay-who-codes/SVG-Browser@main/SVGs/Universe-Magnifying-Glass.svg">

<!-- iOS Home Screen Icon (single 180x180 is sufficient) -->
<link rel="apple-touch-icon" href="/AppFiles/Icons/apple-touch-icon-180x180.png">

<!-- Manifest for Android/Chrome -->
<link rel="manifest" href="/manifest.json">

<style>
    /* ... your existing styles ... */
    @property --rail-w {
        syntax: '<length>';
        inherits: true;
        initial-value: 232px;
    }

    :root {
        /* ── Token system ── */
        --bg: #14171c;
        --bg-rail: #0f1115;
        --surface: #1b1f27;
        --surface-2: #232838;
        --border: #2b3040;
        --text: #e9e6dd;
        --text-dim: #838a9b;
        --text-faint: #565c6b;
        --accent: #c9a35f;       /* brass — primary signal */
        --accent-soft: rgba(201, 163, 95, 0.14);
        --accent2: #4fb0a8;      /* teal — secondary signal */
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);

        --font-display: 'Fraunces', Georgia, serif;
        --font-body: 'Inter', 'Segoe UI', sans-serif;
        --font-mono: 'IBM Plex Mono', 'Courier New', monospace;

        --rail-w: 232px;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
    }

    html {
        min-height: 100%;
    }

    body {
        background:
            radial-gradient(ellipse 900px 500px at 15% -10%, rgba(201, 163, 95, 0.06), transparent 60%),
            var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        line-height: 1.6;
        min-height: 100vh;
        display: grid;
        grid-template-columns: var(--rail-w) 1fr;
        grid-template-rows: 1fr auto;
        transition: grid-template-columns 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    ::selection {
        background: var(--accent-soft);
        color: var(--text);
    }

    a { color: inherit; }

    :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
    }

    /* ── Rail (sidebar nav) ── */
    .rail {
        grid-column: 1;
        grid-row: 1 / 3;
        background: var(--bg-rail);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 28px 18px;
        position: sticky;
        top: 0;
        height: 100vh;
    }

    .brand {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 0 8px 22px 8px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--border);
    }

    .brand .mark {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 1.4rem;
        letter-spacing: 0.01em;
    }

    .brand .mark::after {
        content: '.';
        color: var(--accent);
    }

    .brand .tag {
        font-family: var(--font-mono);
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-faint);
    }

    .rail-eyebrow {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-faint);
        padding: 0 8px;
        margin-bottom: 10px;
    }

    /* ── Nav list (the "channel strip" — signature element) ── */
    #nav-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        background: transparent;
        border: none;
        border-radius: 8px;
        padding: 10px 10px;
        cursor: pointer;
        text-align: left;
        color: var(--text-dim);
        transition: background 0.15s, color 0.15s;
    }

    .nav-item:hover {
        background: color-mix(in srgb, var(--ch, var(--accent)) 10%, var(--surface));
        color: var(--text);
    }

    /* Each nav-item carries its own --ch (channel color), set inline per page.
       Falls back to the global --accent if none is set. */
    .nav-item.active {
        background: color-mix(in srgb, var(--ch, var(--accent)) 14%, transparent);
        color: var(--text);
    }

    .nav-item .idx {
        font-family: var(--font-mono);
        font-size: 0.72rem;
        color: var(--text-faint);
        width: 1.4em;
        flex-shrink: 0;
    }

    .nav-item.active .idx {
        color: var(--ch, var(--accent));
    }

    .nav-item i.nav-icon {
        width: 16px;
        text-align: center;
        font-size: 0.85rem;
        flex-shrink: 0;
        color: var(--ch, var(--text-faint));
    }

    .nav-item .label {
        font-size: 0.92rem;
        font-weight: 500;
        flex: 1;
    }

    .nav-item .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: transparent;
        flex-shrink: 0;
    }

    .nav-item.active .dot {
        background: var(--ch, var(--accent));
        box-shadow: 0 0 8px 1px var(--ch, var(--accent));
    }

    .rail-footer {
        margin-top: auto;
        padding: 14px 8px 4px 8px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: var(--font-mono);
        font-size: 0.68rem;
        color: var(--text-faint);
        letter-spacing: 0.04em;
    }

    #clock {
        color: var(--text-dim);
    }

    /* ── Collapsible rail ── */
    .rail-collapse-btn {
        width: 100%;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-dim);
        cursor: pointer;
        padding: 9px 0;
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.15s, border-color 0.15s;
    }

    .rail-collapse-btn:hover {
        color: var(--accent);
        border-color: var(--accent);
    }

    .rail-collapse-btn i {
        transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .rail.collapsed .rail-collapse-btn i {
        transform: rotate(180deg);
    }

    .rail-footer-compact {
        display: none;
        margin-top: auto;
        padding: 14px 0 4px;
        border-top: 1px solid var(--border);
        font-family: var(--font-mono);
        font-size: 0.66rem;
        color: var(--text-faint);
        text-align: center;
    }

    .rail.collapsed .brand {
        justify-content: center;
    }

    .rail.collapsed .brand .mark {
        font-size: 0;
    }

    .rail.collapsed .brand .mark::after {
        font-size: 1.4rem;
    }

    .rail.collapsed .brand .tag,
    .rail.collapsed .rail-eyebrow,
    .rail.collapsed .nav-item .label,
    .rail.collapsed .nav-item .idx {
        display: none;
    }

    .rail.collapsed .nav-item {
        justify-content: normal;
    }

    .rail.collapsed .rail-footer {
        display: none;
    }

    .rail.collapsed .rail-footer-compact {
        display: block;
    }

    /* ── Main viewport ── */
    .viewport {
        grid-column: 2;
        grid-row: 1;
        padding: 40px 48px 60px;
        max-width: 960px;
        width: 100%;
        margin: 0 auto;
    }

    .section-panel {
        display: none;
        animation: rise 0.25s ease;
    }
    .section-panel.visible {
        display: block;
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .panel-loading {
        color: var(--text-faint);
        font-family: var(--font-mono);
        font-size: 0.8rem;
        padding: 40px 0;
    }

    /* ── Persistent quote footer (shown on every page) ── */
    .app-footer {
        grid-column: 2;
        grid-row: 2;
        border-top: 1px solid var(--border);
        background: var(--bg-rail);
        padding: 14px 48px;
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-height: 46px;
    }

    .app-footer i {
        color: var(--accent);
        font-size: 0.78rem;
        flex-shrink: 0;
    }

    .app-footer .quote-text {
        font-family: var(--font-display);
        font-style: italic;
        font-size: 0.9rem;
        color: var(--text-dim);
        line-height: 1.5;
    }

    /* ── Mobile: rail collapses to a top strip ── */
    @media (max-width: 760px) {
        body {
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr auto;
        }

        .rail {
            grid-column: 1;
            grid-row: 1;
            position: static;
            height: auto;
            flex-direction: row;
            align-items: center;
            padding: 14px 14px;
            border-right: none;
            border-bottom: 1px solid var(--border);
            gap: 16px;
            overflow-x: auto;
        }

        .brand {
            border-bottom: none;
            padding: 0;
            margin-bottom: 0;
            flex-shrink: 0;
        }

        .rail-eyebrow {
            display: none;
        }

        #nav-list {
            flex-direction: row;
            gap: 6px;
        }

        .nav-item {
            flex-shrink: 0;
        }

        .nav-item .label {
            white-space: nowrap;
        }

        .rail-footer {
            display: none;
        }

        .viewport {
            grid-column: 1;
            grid-row: 2;
            padding: 28px 20px 48px;
        }

        .app-footer {
            grid-column: 1;
            grid-row: 3;
            padding: 12px 20px;
            flex-wrap: wrap;
        }

        /* The collapse feature is desktop-only; neutralise it on mobile
           even if a "collapsed" preference was saved on a wider screen. */
        .rail-collapse-btn {
            display: none;
        }

        .rail.collapsed .brand .mark {
            font-size: 1.4rem;
        }

        .rail.collapsed .brand .tag,
        .rail.collapsed .nav-item .label,
        .rail.collapsed .nav-item .idx {
            display: initial;
        }

        .rail.collapsed .rail-footer-compact {
            display: none;
        }
    }
    /* ── Color scheme presets ──
       Applied via [data-theme] on <html>. Only overrides the primary
       accent + the subtle page-wide tint; channel colors (--ch) are
       untouched since those are per-channel, not theme-wide. */
    html[data-theme="red"] {
        --accent: #d9564c;
        --accent-soft: rgba(217, 86, 76, 0.14);
        --bg: color-mix(in srgb, #d9564c 5%, #14171c);
        --bg-rail: color-mix(in srgb, #d9564c 5%, #0f1115);
        --surface: color-mix(in srgb, #d9564c 4%, #1b1f27);
    }
    html[data-theme="red"] body {
        background:
            radial-gradient(ellipse 900px 500px at 15% -10%, rgba(217, 86, 76, 0.09), transparent 60%),
            var(--bg);
    }

    html[data-theme="orange"] {
        --accent: #e0873e;
        --accent-soft: rgba(224, 135, 62, 0.14);
        --bg: color-mix(in srgb, #e0873e 5%, #14171c);
        --bg-rail: color-mix(in srgb, #e0873e 5%, #0f1115);
        --surface: color-mix(in srgb, #e0873e 4%, #1b1f27);
    }
    html[data-theme="orange"] body {
        background:
            radial-gradient(ellipse 900px 500px at 15% -10%, rgba(224, 135, 62, 0.09), transparent 60%),
            var(--bg);
    }

html[data-theme="yellow"] {
    --accent: #d4b83a;
    --accent-soft: rgba(212, 184, 58, 0.14);
    --bg: color-mix(in srgb, #d4b83a 5%, #14171c);
    --bg-rail: color-mix(in srgb, #d4b83a 5%, #0f1115);
    --surface: color-mix(in srgb, #d4b83a 4%, #1b1f27);
}
html[data-theme="yellow"] body {
    background:
        radial-gradient(ellipse 900px 500px at 15% -10%, rgba(212, 184, 58, 0.09), transparent 60%),
        var(--bg);
}

    html[data-theme="green"] {
    --accent: #4caf6e;
    --accent-soft: rgba(76, 175, 110, 0.14);
    --bg: color-mix(in srgb, #4caf6e 5%, #14171c);
    --bg-rail: color-mix(in srgb, #4caf6e 5%, #0f1115);
    --surface: color-mix(in srgb, #4caf6e 4%, #1b1f27);
}

  html[data-theme="green"] body {
    background:
        radial-gradient(ellipse 900px 500px at 15% -10%, rgba(76, 175, 110, 0.09), transparent 60%),
        var(--bg);
}

  html[data-theme="blue"] {
    --accent: #008aff;
    --accent-soft: rgba(0, 138, 255, 0.14);
    --bg: color-mix(in srgb, #008aff 5%, #14171c);
    --bg-rail: color-mix(in srgb, #00bfff 5%, #0f1115);
    --surface: color-mix(in srgb, #00bfff 4%, #1b1f27);
}
    html[data-theme="blue"] body {
        background:
            radial-gradient(ellipse 900px 500px at 15% -10%, rgba(0, 138, 255, 0.14), transparent 60%),
            var(--bg);
    }

html[data-theme="purple"] {
    --accent: #9a5fe0;
    --accent-soft: rgba(154, 95, 224, 0.14);
    --bg: color-mix(in srgb, #9a5fe0 5%, #14171c);
    --bg-rail: color-mix(in srgb, #9a5fe0 5%, #0f1115);
    --surface: color-mix(in srgb, #9a5fe0 4%, #1b1f27);
}
html[data-theme="purple"] body {
    background:
        radial-gradient(ellipse 900px 500px at 15% -10%, rgba(154, 95, 224, 0.09), transparent 60%),
        var(--bg);
}

html[data-theme="pink"] {
    --accent: #e0609a;
    --accent-soft: rgba(224, 96, 154, 0.14);
    --bg: color-mix(in srgb, #e0609a 5%, #14171c);
    --bg-rail: color-mix(in srgb, #e0609a 5%, #0f1115);
    --surface: color-mix(in srgb, #e0609a 4%, #1b1f27);
}
html[data-theme="pink"] body {
    background:
        radial-gradient(ellipse 900px 500px at 15% -10%, rgba(224, 96, 154, 0.09), transparent 60%),
        var(--bg);
}
  
/* ── Animated Rainbow ── */
@property --hue {
    syntax: '<number>';
    inherits: true;
    initial-value: 0;
}

html[data-theme="rainbow"] {
    --hue: 0;
    --accent: hsl(var(--hue) 75% 62%);
    --accent-soft: hsl(var(--hue) 75% 62% / 0.14);
    --bg: color-mix(in srgb, hsl(var(--hue) 75% 62%) 5%, #14171c);
    --bg-rail: color-mix(in srgb, hsl(var(--hue) 75% 62%) 5%, #0f1115);
    --surface: color-mix(in srgb, hsl(var(--hue) 75% 62%) 4%, #1b1f27);
    animation: rainbow-cycle 10s linear infinite;
}
html[data-theme="rainbow"] body {
    background:
        radial-gradient(ellipse 900px 500px at 15% -10%, hsl(var(--hue) 75% 62% / 0.1), transparent 60%),
        var(--bg);
}
@keyframes rainbow-cycle {
    to { --hue: 360; }
}

/* ── Custom theme ──
   Unlike the presets above, custom-theme colours aren't hardcoded here —
   they're written as inline CSS variable overrides on <html> by JS
   (see applyCustomColors). This block only supplies the page-wide tint,
   which needs to react to whatever accent the user picks. */
html[data-theme="custom"] body {
    background:
        radial-gradient(ellipse 900px 500px at 15% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
        var(--bg);
}

    /* ── Settings / help buttons (top-right, every page) ── */
    .settings-btn {
        position: fixed;
        top: 18px;
        right: 22px;
        z-index: 50;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 1rem;
        transition: background 0.15s, color 0.15s, transform 0.15s;
    }

    .settings-btn:hover {
        background: var(--accent-soft);
        color: var(--accent);
        transform: rotate(24deg);
    }

    .help-btn {
        right: 68px;
    }

    .help-btn:hover {
        transform: none;
    }

    /* ── Settings / shortcuts panel ── */
    .settings-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 60;
        display: none;
        align-items: flex-start;
        justify-content: flex-end;
    }

    .settings-overlay.open {
        display: flex;
    }

    .settings-panel {
        margin: 66px 22px 0 0;
        width: 280px;
        max-width: calc(100vw - 44px);
        max-height: 80vh;
        overflow-y: auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 18px;
        animation: rise 0.15s ease;
    }

    .settings-panel h2 {
        font-family: var(--font-display);
        font-size: 1.05rem;
        font-weight: 600;
        margin-bottom: 4px;
    }

    .settings-panel .settings-sub {
        font-family: var(--font-mono);
        font-size: 0.66rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-faint);
        margin-bottom: 16px;
    }

    .theme-option {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 9px 10px;
        margin-bottom: 6px;
        cursor: pointer;
        color: var(--text-dim);
        font-family: var(--font-body);
        font-size: 0.88rem;
        text-align: left;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .theme-option:last-child {
        margin-bottom: 0;
    }

    .theme-option:hover {
        background: var(--accent-soft);
        color: var(--text);
    }

    .theme-option.active {
        border-color: var(--theme-swatch, var(--accent));
        background: var(--accent-soft);
        color: var(--text);
    }

    .theme-option .swatch {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--theme-swatch);
        border: 1px solid rgba(255,255,255,0.15);
    }

    .theme-option .check {
        margin-left: auto;
        font-size: 0.8rem;
        color: var(--theme-swatch, var(--accent));
        visibility: hidden;
    }

    .theme-option.active .check {
        visibility: visible;
    }

    /* ── Custom theme editor ── */
    .custom-theme-editor {
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
    }

    .custom-theme-editor.hidden {
        display: none;
    }

    .custom-color-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 2px;
        cursor: pointer;
    }

    .custom-color-label {
        font-size: 0.82rem;
        color: var(--text-dim);
    }

    .custom-color-input {
        -webkit-appearance: none;
        appearance: none;
        width: 30px;
        height: 22px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: none;
        cursor: pointer;
        flex-shrink: 0;
    }

    .custom-color-input::-webkit-color-swatch-wrapper {
        padding: 2px;
    }

    .custom-color-input::-webkit-color-swatch {
        border: none;
        border-radius: 4px;
    }

    .custom-color-input::-moz-color-swatch {
        border: none;
        border-radius: 4px;
    }

    .custom-action-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
    }

    .custom-action-btn {
        flex: 1;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        color: var(--text-faint);
        font-family: var(--font-mono);
        font-size: 0.66rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: color 0.15s, border-color 0.15s;
    }

    .custom-action-btn:hover {
        color: var(--accent);
        border-color: var(--accent);
    }

    /* ── Keyboard shortcuts modal ── */
    .shortcuts-panel {
        width: 320px;
    }

    .shortcut-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 2px;
        border-bottom: 1px solid var(--border);
    }

    .shortcut-row:last-child {
        border-bottom: none;
    }

    .shortcut-desc {
        font-size: 0.84rem;
        color: var(--text-dim);
    }

    .shortcut-keys {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        justify-content: flex-end;
        flex-shrink: 0;
    }

    kbd.key {

    <script src="https://cdn.jsdelivr.net/gh/kay-who-codes/Kay-App-Assets@main/Headers/Header.js"></script><script>
        /* ────────────────────────────────────────────────────────────

        const PAGES = [

    { id: 'search',    label: 'Search',    icon: 'fa-solid fa-magnifying-glass', file: 'Pages/search.html', color: '#e0c93a' },

        function showSection(id) {

                document.getElementById('panel-' + page.id).classList.toggle('visible', page.id === id);
                document.getElementById('nav-' + page.id).classList.toggle('active', page.id === id);

        // ── Generic fragment loader ──
        // Fetches an HTML fragment (its own <style>/markup/<script>) and
        // mounts it into the given container, executing its script.
        // Tracks which pages have been loaded (for lazy-loading) and calls
        // each page's cleanup hook (window.__pageCleanup[id]) before a
        // reload, so re-invoking loadFragment for the same page doesn't
        // stack duplicate listeners/intervals.
        const loadedPages = new Set();

        // Tracks the <script> elements injected for each page's most recent
        // load, so a reload can remove the old (now-inert) nodes instead of
        // letting them accumulate in the DOM forever.
        const pageScriptNodes = new Map();

        async function loadFragment(url, containerId, pageId) {
    const container = document.getElementById(containerId);

    // Run this page's cleanup hook, if it registered one, before we wipe
    // and replace its markup — lets a fragment tear down listeners,
    // intervals, etc. from a previous load.
    const cleanupFn = pageId && window.__pageCleanup && window.__pageCleanup[pageId];
    if (typeof cleanupFn === 'function') {
        try { cleanupFn(); } catch (err) { console.error('Cleanup error for', pageId, err); }
    }

    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`${res.status}`);
        const html = await res.text();

        // Extract <style> blocks directly from raw text (regex, not DOMParser —
        // DOMParser's HTML parsing gets confused by <svg> markup nested inside
        // <script> template literals and ends script parsing early).
        const styleRe = /<style[^>]*>([\s\S]*?)<\/style>/gi;
        let m;
        while ((m = styleRe.exec(html)) !== null) {
            const styleEl = document.createElement('style');
            styleEl.textContent = m[1];
            document.head.appendChild(styleEl);
        }

        // Extract <script> blocks the same way.
        const scriptRe = /<script[^>]*>([\s\S]*?)<\/script>/gi;
        const scripts = [];
        while ((m = scriptRe.exec(html)) !== null) {
            scripts.push(m[1]);
        }

        // Whatever's left after stripping style/script tags is the markup.
        const markup = html.replace(styleRe, '').replace(scriptRe, '');
        container.innerHTML = markup;

        // Remove this page's script nodes from its previous load (if any)
        // before appending new ones — otherwise every reload leaves the old,
        // now-inert <script> tags sitting in the DOM permanently.
        if (pageId && pageScriptNodes.has(pageId)) {
            pageScriptNodes.get(pageId).forEach(node => node.remove());
        }

        // Re-create and append each script so it actually executes.
        const newNodes = scripts.map(code => {
            const s = document.createElement('script');
            s.textContent = code;
            document.body.appendChild(s);
            return s;
        });

        if (pageId) {
            pageScriptNodes.set(pageId, newNodes);
            loadedPages.add(pageId);
        }
    } catch (err) {
        container.innerHTML = `<p class="panel-loading">Couldn't load this page (${err.message}). If you're opening this file directly from disk, serve it over a local web server instead.</p>`;
    }
}

        // Lazily loads a page's fragment the first time its panel is shown.
        function ensurePageLoaded(id) {
            if (loadedPages.has(id)) return;
            const page = PAGES.find(p => p.id === id);
            if (!page) return;
            loadFragment(page.file, 'panel-' + page.id, page.id);
        }

        function pad2(n) {
            return n.toString().padStart(2, '0');
        }

        function ordinal(n) {
            const s = ['th', 'st', 'nd', 'rd'];
            const v = n % 100;
            return n + (s[(v - 20) % 10] || s[v] || s[0]);
        }

        // Alternates the collapsed-rail footer between a short dd/mm date
        // and the time, flipping every few seconds. Only visible while the
        // rail is collapsed (see .rail.collapsed .rail-footer-compact CSS).
        let compactShowingTime = false;

        function tickClock() {
            const now = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June',
                            'July', 'August', 'September', 'October', 'November', 'December'];

            // Update date (e.g. "Sun, 26th July")
            const dateEl = document.getElementById('date');
            dateEl.textContent = `${days[now.getDay()]}, ${ordinal(now.getDate())} ${months[now.getMonth()]}`;

            // Update time
            const clockEl = document.getElementById('clock');
            clockEl.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            // Update the collapsed-rail compact readout
            const compactEl = document.getElementById('rail-footer-compact');
            if (compactEl) {
                compactEl.textContent = compactShowingTime
                    ? now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    : `${pad2(now.getDate())}/${pad2(now.getMonth() + 1)}`;
            }
        }

        function tickCompactAlternator() {
            compactShowingTime = !compactShowingTime;
            tickClock();
        }

        // ── Persistent quote footer ──

        // — the author isn't part of the data, just organizational).
        // ── Persistent quote footer ──
function resolveQuotesArray() {
    const candidates = [
        window.QUOTES, window.Quotes, window.quotes,
        window.QuoteList, window.quoteList
    ];
    for (const c of candidates) {
        if (Array.isArray(c) && c.length) return c;
    }
    return null;
}

function renderQuote(entry) {
    const text = typeof entry === 'string' ? entry : (entry && (entry.text || entry.quote)) || '';
    document.getElementById('footer-quote-text').textContent = text || 'No quote available.';
}

function loadFooterQuote() {
    const quoteElement = document.getElementById('footer-quote-text');
    
    // First check if quotes are already loaded
    const existing = resolveQuotesArray();
    if (existing && existing.length) {
        renderQuote(existing[Math.floor(Math.random() * existing.length)]);
        return;
    }
    
    // Try loading the script with cache-busting to avoid caching issues
    const script = document.createElement('script');
    script.src = 'AppFiles/Quotes.js?v=' + Date.now();
    
    script.onload = function() {
        console.log('Script loaded, checking for quotes...');
        // Wait a tiny bit to ensure the script executed
        setTimeout(() => {
            const list = resolveQuotesArray();
            if (list && list.length) {
                renderQuote(list[Math.floor(Math.random() * list.length)]);
                console.log('✅ Quote loaded successfully');
            } else {
                quoteElement.textContent = "Found Quotes.js but no quotes array.";
                console.warn('No quotes array found. Available window props:', Object.keys(window).filter(k => k.includes('quote') || k.includes('Quote')));
            }

    };
    
    script.onerror = function() {
        console.error('Failed to load Quotes.js');

        const altScript = document.createElement('script');
        altScript.src = '/AppFiles/Quotes.js?v=' + Date.now();
        altScript.onload = function() {
            setTimeout(() => {
                const list = resolveQuotesArray();
                if (list && list.length) {
                    renderQuote(list[Math.floor(Math.random() * list.length)]);
                } else {
                    quoteElement.textContent = "Couldn't load quotes from /AppFiles/Quotes.js";
                }
            }, 50);
        };
        altScript.onerror = function() {
            quoteElement.textContent = "⚠️ Couldn't load AppFiles/Quotes.js. Check file path.";
        };
        document.body.appendChild(altScript);
    };
    
    document.body.appendChild(script);
}
        // ── Keyboard navigation ──
        // 1–7 jump straight to the matching channel (and focus its primary
        // text box, via window.__pageFocus[id], same hook showSection uses).
        // Up/Down move to the previous/next channel. '?' opens the
        // shortcuts cheat sheet.
        function isTypingTarget(el) {
            if (!el) return false;
            const tag = el.tagName;
            return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
        }

        function currentPageIndex() {
            const i = PAGES.findIndex(p => document.getElementById('panel-' + p.id).classList.contains('visible'));
            return i === -1 ? 0 : i;
        }

        document.addEventListener('keydown', (e) => {
            // Page Up / Page Down always switch channels, even while typing.
            if (e.key === 'PageDown' || e.key === 'PageUp') {
                e.preventDefault();
                const cur = currentPageIndex();
                const next = e.key === 'PageDown'
                    ? (cur + 1) % PAGES.length
                    : (cur - 1 + PAGES.length) % PAGES.length;
                showSection(PAGES[next].id);
                document.getElementById('nav-' + PAGES[next].id).scrollIntoView({ block: 'nearest', inline: 'nearest' });
                return;
            }

            if (isTypingTarget(document.activeElement)) return;
            if (e.altKey || e.ctrlKey || e.metaKey) return;

            // '?' → open the keyboard-shortcuts cheat sheet.
            if (e.key === '?') {
                e.preventDefault();
                openShortcuts();
                return;
            }

            // Number keys 1–7 → jump to that channel.
            if (e.key >= '1' && e.key <= '9') {
                const idx = parseInt(e.key, 10) - 1;
                if (idx >= 0 && idx < PAGES.length) {
                    e.preventDefault();
                    showSection(PAGES[idx].id);
                    document.getElementById('nav-' + PAGES[idx].id).scrollIntoView({ block: 'nearest', inline: 'nearest' });
                }
                return;
            }

            // Up/Down → move to previous/next channel.
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                e.preventDefault();
                const cur = currentPageIndex();
                const next = e.key === 'ArrowDown'
                    ? (cur + 1) % PAGES.length
                    : (cur - 1 + PAGES.length) % PAGES.length;
                showSection(PAGES[next].id);
                document.getElementById('nav-' + PAGES[next].id).scrollIntoView({ block: 'nearest', inline: 'nearest' });
            }
        });

        // ── Keyboard shortcuts cheat sheet ──
        const SHORTCUTS = [
            { keys: ['1', '–', '9'], desc: 'Jump to a channel' },
            { keys: ['↑'], desc: 'Previous channel' },
            { keys: ['↓'], desc: 'Next channel' },
            { keys: ['Page Up'], desc: 'Previous channel (works while typing)' },
            { keys: ['Page Down'], desc: 'Next channel (works while typing)' },
            { keys: ['?'], desc: 'Show this shortcuts list' },

                const row = document.createElement('div');

        function openShortcuts() {

        // ── Settings: colour scheme presets ──
        const THEMES = [
    { id: 'default', label: 'Default', swatch: '#a9a9a9' },
    { id: 'red',     label: 'Red',     swatch: '#d9564c' },
    { id: 'orange',  label: 'Orange',  swatch: '#e0873e' },
    { id: 'yellow',  label: 'Yellow',  swatch: '#d4b83a' },
    { id: 'green',   label: 'Green',   swatch: '#4caf6e' },
    { id: 'blue',    label: 'Blue',    swatch: '#008aff' },
    { id: 'purple',  label: 'Purple',  swatch: '#9a5fe0' },
    { id: 'pink',    label: 'Pink',    swatch: '#e0609a' },
    { id: 'rainbow', label: 'Rainbow', swatch: 'conic-gradient(from 0deg, red, orange, yellow, green, blue, purple, red)' },
    { id: 'custom',  label: 'Custom',  swatch: '#a9a9a9' }
];

        // ── Custom theme ──
        // Fields the user can recolour, mapped to the CSS custom properties
        // they override. Anything not listed here (e.g. --accent-soft) is
        // derived automatically from --accent.
        const CUSTOM_COLOR_FIELDS = [
            { key: '--accent',  label: 'Accent' },
            { key: '--accent2', label: 'Accent (secondary)' },
            { key: '--bg',      label: 'Background' },
            { key: '--bg-rail', label: 'Rail background' },
            { key: '--surface', label: 'Surface' },
            { key: '--text',    label: 'Text' },
            { key: '--border',  label: 'Border' }
        ];

        const DEFAULT_CUSTOM_COLORS = {
            '--accent': '#c9a35f',
            '--accent2': '#4fb0a8',
            '--bg': '#14171c',
            '--bg-rail': '#0f1115',
            '--surface': '#1b1f27',
            '--text': '#e9e6dd',
            '--border': '#2b3040'
        };

        function loadCustomColors() {
            try {
                const raw = localStorage.getItem(STORAGE_KEYS.customColors);
                if (raw) return { ...DEFAULT_CUSTOM_COLORS, ...JSON.parse(raw) };
            } catch (err) { /* ignore */ }
            return { ...DEFAULT_CUSTOM_COLORS };
        }

        function saveCustomColors(colors) {
            try { localStorage.setItem(STORAGE_KEYS.customColors, JSON.stringify(colors)); } catch (err) { /* ignore */ }
        }

        // Writes the custom colours as inline CSS variable overrides on
        // <html>. Inline styles beat the :root defaults, so this works
        // whether or not html[data-theme="custom"] is currently set.
        function applyCustomColors(colors) {
            CUSTOM_COLOR_FIELDS.forEach(field => {
                document.documentElement.style.setProperty(field.key, colors[field.key]);
            });
            // --accent-soft isn't user-facing; derive it from --accent the
            // same way the presets do, via color-mix instead of rgba math.
            document.documentElement.style.setProperty(
                '--accent-soft',
                `color-mix(in srgb, ${colors['--accent']} 14%, transparent)`
            );
        }

        function clearCustomColorOverrides() {
            CUSTOM_COLOR_FIELDS.forEach(field => document.documentElement.style.removeProperty(field.key));
            document.documentElement.style.removeProperty('--accent-soft');
        }

        // ── Harmonious randomiser ──
        // Picks a random hue for the accent, a hue ~150–210° away for the
        // secondary accent (roughly triadic/split-complementary, so the two
        // read as "intentionally paired" rather than clashing), and derives
        // dark, low-saturation surfaces from the same hue family so the
        // whole palette feels cohesive rather than random per-swatch.
        function hslToHex(h, s, l) {
            s /= 100; l /= 100;
            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
            const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
            return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
        }

        function randomInRange(min, max) {
            return min + Math.random() * (max - min);
        }

        function randomizeCustomColors() {
            const hue = Math.floor(Math.random() * 360);
            const accent2Hue = (hue + 150 + Math.random() * 60) % 360;

            const colors = {
                '--accent': hslToHex(hue, randomInRange(55, 72), randomInRange(52, 64)),
                '--accent2': hslToHex(accent2Hue, randomInRange(50, 68), randomInRange(52, 64)),
                '--bg': hslToHex(hue, randomInRange(12, 22), 7),
                '--bg-rail': hslToHex(hue, randomInRange(12, 22), 5),
                '--surface': hslToHex(hue, randomInRange(12, 22), 11),
                '--border': hslToHex(hue, randomInRange(10, 18), 20),
                '--text': hslToHex(hue, 10, 92)
            };

            saveCustomColors(colors);
            applyCustomColors(colors);
            renderCustomEditor('custom');
            renderThemeOptions('custom');
        }

        const settingsBtn = document.getElementById('settings-btn');
        const settingsOverlay = document.getElementById('settings-overlay');
        const settingsPanel = document.getElementById('settings-panel');
        const themeOptionsEl = document.getElementById('theme-options');
        const customEditorEl = document.getElementById('custom-theme-editor');

        function applyTheme(id) {
            if (id === 'default') {
                document.documentElement.removeAttribute('data-theme');
                clearCustomColorOverrides();
            } else if (id === 'custom') {
                document.documentElement.setAttribute('data-theme', 'custom');
                applyCustomColors(loadCustomColors());
            } else {
                document.documentElement.setAttribute('data-theme', id);
                clearCustomColorOverrides();
            }
            try { localStorage.setItem(STORAGE_KEYS.theme, id); } catch (err) { /* ignore */ }
            renderThemeOptions(id);
            renderCustomEditor(id);
        }

        function renderThemeOptions(activeId) {
            themeOptionsEl.innerHTML = '';
            THEMES.forEach(theme => {
                const btn = document.createElement('button');
                btn.className = 'theme-option' + (theme.id === activeId ? ' active' : '');
                // The "Custom" swatch reflects whatever accent the user has
                // actually picked, not a fixed preset colour.
                const swatch = theme.id === 'custom' ? loadCustomColors()['--accent'] : theme.swatch;
                btn.style.setProperty('--theme-swatch', swatch);
                btn.addEventListener('click', () => applyTheme(theme.id));
                btn.innerHTML = `
                    <span class="swatch"></span>
                    <span>${theme.label}</span>
                    <i class="fa-solid fa-check check"></i>
                `;
                themeOptionsEl.appendChild(btn);
            });
        }

        // Shows/hides and (re)builds the colour-picker rows for the custom
        // theme. Only visible while "Custom" is the active theme.
        function renderCustomEditor(activeId) {
            if (activeId !== 'custom') {
                customEditorEl.classList.add('hidden');
                customEditorEl.innerHTML = '';
                return;
            }
            customEditorEl.classList.remove('hidden');
            customEditorEl.innerHTML = '';
            const colors = loadCustomColors();

            const heading = document.createElement('div');
            heading.className = 'settings-sub';
            heading.style.marginBottom = '4px';
            heading.textContent = 'Custom colours';
            customEditorEl.appendChild(heading);

            CUSTOM_COLOR_FIELDS.forEach(field => {
                const row = document.createElement('label');
                row.className = 'custom-color-row';

                const name = document.createElement('span');
                name.className = 'custom-color-label';
                name.textContent = field.label;

                const input = document.createElement('input');
                input.type = 'color';
                input.className = 'custom-color-input';
                input.value = colors[field.key];
                input.addEventListener('input', () => {
                    colors[field.key] = input.value;
                    applyCustomColors(colors);
                    saveCustomColors(colors);
                    // Keep the "Custom" row's swatch in the theme list in
                    // sync as the accent colour is dragged live.
                    if (field.key === '--accent') renderThemeOptions('custom');
                });

                row.appendChild(name);
                row.appendChild(input);
                customEditorEl.appendChild(row);
            });

            const actionRow = document.createElement('div');
            actionRow.className = 'custom-action-row';

            const randomBtn = document.createElement('button');
            randomBtn.className = 'custom-action-btn';
            randomBtn.innerHTML = '<i class="fa-solid fa-dice"></i> Randomise';
            randomBtn.addEventListener('click', () => randomizeCustomColors());

            const resetBtn = document.createElement('button');
            resetBtn.className = 'custom-action-btn';
            resetBtn.innerHTML = '<i class="fa-solid fa-rotate-left"></i> Reset';
            resetBtn.addEventListener('click', () => {
                const fresh = { ...DEFAULT_CUSTOM_COLORS };
                saveCustomColors(fresh);
                applyCustomColors(fresh);
                renderCustomEditor('custom');
                renderThemeOptions('custom');
            });

            actionRow.appendChild(randomBtn);
            actionRow.appendChild(resetBtn);
            customEditorEl.appendChild(actionRow);
        }

        function openSettings() {
            settingsOverlay.classList.add('open');
            settingsBtn.setAttribute('aria-expanded', 'true');
        }

        function closeSettings() {
            settingsOverlay.classList.remove('open');
            settingsBtn.setAttribute('aria-expanded', 'false');
        }

        settingsBtn.addEventListener('click', () => {
            if (shortcutsOverlay.classList.contains('open')) closeShortcuts();
            settingsOverlay.classList.contains('open') ? closeSettings() : openSettings();
        });

        settingsOverlay.addEventListener('click', (e) => {
            if (e.target === settingsOverlay) closeSettings();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (settingsOverlay.classList.contains('open')) closeSettings();
            if (shortcutsOverlay.classList.contains('open')) closeShortcuts();
        });

        function initTheme() {
            let saved = 'default';
            try { saved = localStorage.getItem(STORAGE_KEYS.theme) || 'default'; } catch (err) { /* ignore */ }
            applyTheme(saved);
        }

        // ── Collapsible rail ──
        const railEl = document.querySelector('.rail');
        const railCollapseBtn = document.getElementById('rail-collapse-btn');
        const RAIL_WIDTH_EXPANDED = '232px';
        const RAIL_WIDTH_COLLAPSED = '68px';

        function setRailCollapsed(collapsed) {
            railEl.classList.toggle('collapsed', collapsed);
            document.documentElement.style.setProperty('--rail-w', collapsed ? RAIL_WIDTH_COLLAPSED : RAIL_WIDTH_EXPANDED);
            const label = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
            railCollapseBtn.setAttribute('aria-label', label);
            railCollapseBtn.title = label;
            try { localStorage.setItem(STORAGE_KEYS.railCollapsed, collapsed ? 'true' : 'false'); } catch (err) { /* ignore */ }
        }

        railCollapseBtn.addEventListener('click', () => {
            setRailCollapsed(!railEl.classList.contains('collapsed'));
        });

        function initRailCollapse() {
            let collapsed = false;
            try { collapsed = localStorage.getItem(STORAGE_KEYS.railCollapsed) === 'true'; } catch (err) { /* ignore */ }
            setRailCollapsed(collapsed);
        }

        document.addEventListener('DOMContentLoaded', () => {
            buildNav();
            buildPanels();
            // Only the first (initially visible) channel loads eagerly;
            // the rest are fetched lazily the first time their panel is shown.
            if (PAGES.length) ensurePageLoaded(PAGES[0].id);
            tickClock();
            setInterval(tickClock, 15000);
            setInterval(tickCompactAlternator, 4000);
            loadFooterQuote();
            initTheme();
            initRailCollapse();
        });
    </script>


</body></html>
